<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyPage</title>

  <link rel="stylesheet" href="/fonts/font.css">
  <link rel="stylesheet" href="/css/mypage/mypage-content.css">
  <link rel="stylesheet" th:href="@{/css/mypage/mypage-profile-modal.css}">
  <link rel="stylesheet" th:href="@{/css/basic/footer.css}">
  <link rel="stylesheet" th:href="@{/css/basic/sidebar.css}">
  <link rel="stylesheet" th:href="@{/css/basic/header.css}">
  <link rel="stylesheet" th:href="@{/css/basic/main-content-area.css}">

</head>

<body>
<div class="layout">

  <div th:replace="~{basic/sidebar :: sidebar}"></div>

  <div class="main-content-area">

    <div th:replace="~{basic/header :: header('My Page')}">My Page</div>

    <main class="content">

      <!-- 프로필 카드 -->
      <section class="profile-card">

        <h2 class="card-title">Profile</h2>
        <h4 class="card-title-descrip">조회만 가능. 정보 수정은 아래의 버튼을 눌러주세요.</h4>

        <div class="profile-body">

          <!-- 가입 시 등록한 정보 표시 (읽기 전용) -->
          <!-- 비밀번호는 이 화면에 노출 x -->
          <div class="profile-form">

            <div class="form-group">
              <label for="id">아이디</label>
              <input type="text" id="id" th:value="${myInfo.loginId}" readonly>
            </div>

            <div class="form-group">
              <label for="username">사용자 이름</label>
              <input type="text" id="username" th:value="${myInfo.name}" readonly>
            </div>

            <div class="form-group">
              <label for="email">e - mail</label>
              <input type="email" id="email" th:value="${myInfo.email}" readonly>
            </div>

          </div>

        </div>

        <!-- 클릭 시 프로필 수정 팝업 오픈 -->
        <button type="button" class="edit-profile-btn" id="openEditModalBtn" aria-haspopup="dialog"
                aria-controls="editProfileModal">Edit Profile</button>

      </section>

      <!-- 결제 카드 + 틸트 카드를 세로로 묶는 래퍼 -->
      <div class="promo-stack">

        <div class="card">
          <div class="wrapper">
            <div class="card-image">❑</div>
            <div class="promo-content">
              <p class="title"> 공간을 관리하고, &nbsp;<br>
                팀을 만드세요</p>
              <p class="title price">&nbsp; ￦3</p>
              <p class="title price old-price">&nbsp;￦6</p>
            </div>
            <button class="card-btn">Subscribe</button>
          </div>
          <p class="tag">-50%</p>
        </div>

        <div class="tilt-container noselect">
          <div class="tilt-canvas">
            <div class="tilt-tracker tr-1"></div>
            <div class="tilt-tracker tr-2"></div>
            <div class="tilt-tracker tr-3"></div>
            <div class="tilt-tracker tr-4"></div>
            <div class="tilt-tracker tr-5"></div>
            <div class="tilt-tracker tr-6"></div>
            <div class="tilt-tracker tr-7"></div>
            <div class="tilt-tracker tr-8"></div>
            <div class="tilt-tracker tr-9"></div>
            <div class="tilt-tracker tr-10"></div>
            <div class="tilt-tracker tr-11"></div>
            <div class="tilt-tracker tr-12"></div>
            <div class="tilt-tracker tr-13"></div>
            <div class="tilt-tracker tr-14"></div>
            <div class="tilt-tracker tr-15"></div>
            <div class="tilt-tracker tr-16"></div>
            <div class="tilt-tracker tr-17"></div>
            <div class="tilt-tracker tr-18"></div>
            <div class="tilt-tracker tr-19"></div>
            <div class="tilt-tracker tr-20"></div>
            <div class="tilt-tracker tr-21"></div>
            <div class="tilt-tracker tr-22"></div>
            <div class="tilt-tracker tr-23"></div>
            <div class="tilt-tracker tr-24"></div>
            <div class="tilt-tracker tr-25"></div>
            <div class="tilt-card">
              <p class="tilt-prompt">Do You want<br>Make a Team?</p>
              <div class="tilt-title">&nbsp;&nbsp;관리자가<br>되어보세요!</div>
            </div>
          </div>
        </div>

      </div>

    </main>
  </div>
</div>

<div th:replace="~{basic/footer :: footer}"></div>

<!-- ===================== 프로필 수정 팝업 ===================== -->
<!-- 네이티브 <dialog> 사용: focus trap / ESC 닫기 / 배경 inert 처리를 브라우저가 자동으로 처리 -->
<dialog class="modal" id="editProfileModal" aria-labelledby="editProfileModalTitle">
  <div class="modal-header">
    <h2 id="editProfileModalTitle">프로필 수정</h2>
    <button type="button" class="modal-close" id="editModalCloseBtn" aria-label="닫기">&times;</button>
  </div>

  <form id="editProfileForm" class="modal-body" novalidate>

    <div class="form-group">
      <label for="editUsername">사용자 이름</label>
      <input type="text" id="editUsername" name="name" th:value="${myInfo.name}" required>
    </div>

    <div class="form-group">
      <label for="editEmail">e - mail</label>
      <input type="email" id="editEmail" name="email" th:value="${myInfo.email}" required>
    </div>

    <div class="form-divider"></div>

    <div class="form-group">
      <label for="editPassword">비밀번호</label>
      <div class="password-field">
        <input type="password" id="editPassword" name="password"
               placeholder="변경하지 않으려면 비워두세요" autocomplete="new-password">
        <img src="/photo/icon/pw-eye.png" alt="toggle password" class="eye-icon">
      </div>
    </div>

    <div class="form-group">
      <label for="editPasswordCheck">비밀번호 확인</label>
      <div class="password-field">
        <input type="password" id="editPasswordCheck" name="passwordConfirm"
               placeholder="비밀번호 확인" autocomplete="new-password">
        <img src="/photo/icon/pw-eye.png" alt="toggle password" class="eye-icon">
      </div>
    </div>

    <p class="form-error" id="editFormError" role="alert"></p>

    <div class="modal-actions">
      <button type="button" class="btn btn-outline" id="editModalCancelBtn"><img src="/photo/icon/Refund_back.png" alt="뒤로가기"></button>
      <button type="submit" class="setting-btn" id="editModalSaveBtn">저장</button>
    </div>

  </form>
</dialog>

<script src="/js/eye.js"></script>
<script th:src="@{/js/mypage-profile-modal.js}"></script>
</body>
</html>
