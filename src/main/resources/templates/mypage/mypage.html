<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyPage</title>

  <link rel="stylesheet" href="/css/font.css">
  <link rel="stylesheet" href="/css/mypage-layout.css">
  <link rel="stylesheet" th:href="@{/css/footer.css}">
</head>

<body>
<div class="layout">

  <div th:replace="~{mypage/mypageSidebar :: mypageSidebar}"></div>

  <div class="main-wrapper">

    <div th:replace="~{basic/header :: header}"></div>

    <main class="content">

      <!-- 프로필 카드 -->
      <section class="profile-card">

        <h2 class="card-title">Profile</h2>

        <div class="profile-body">

          <form class="profile-form">

            <div class="form-group">
              <label for="id">아이디</label>
              <input type="text" id="id" placeholder="ID" th:value="${myInfo.loginId}" readonly>
            </div>

            <div class="form-group">
              <label for="username">사용자 이름</label>
              <input type="text" id="username" placeholder="사용자 이름" th:value="${myInfo.name}">
            </div>

            <div class="form-group">
              <label for="email">e - mail</label>
              <input type="email" id="email" placeholder="e - mail" th:value="${myInfo.email}">
            </div>

            <div class="form-group">
              <label for="password">비밀번호</label>
              <div class="password-field">
                <input type="password" id="password" placeholder="새 비밀번호를 입력하세요">
                <img src="/photo/icon/pw-eye.png" alt="toggle password" class="eye-icon">
              </div>
            </div>

            <div class="form-group">
              <label for="password-check">비밀번호 확인</label>
              <div class="password-field">
                <input type="password" id="password-check" placeholder="비밀번호 확인">
                <img src="/photo/icon/pw-eye.png" alt="toggle password" class="eye-icon">
              </div>
            </div>

          </form>

          <div class="profile-photo"></div>

        </div>

        <button type="submit" class="setting-btn">Setting</button>

      </section>

      <!-- 오른쪽 세로 배너 두 개를 세로로 묶는 wrapper -->
      <div class="banner-stack">
        <div class="card">공간관리를<br> 원하세요?</div>

        <div class="box">
          <span></span>
          <div class="box-content">
            <h2>&emsp; Go to Subscribe</h2>
          </div>
        </div>
      </div>

    </main>
  </div>
</div>

<div th:replace="~{basic/footer :: footer}"></div>

<script src="/js/eye.js"></script>
</body>
</html>
