<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyPage</title>

  <!--font-->
  <link rel="stylesheet" href="/css/font.css">

  <!-- CSS -->
  <link rel="stylesheet" href="/css/forgotpw.css">
</head>


<body>
<!-- 좌측 상단 로고 -->
<div class="brand-logo">
  <img src="/photo/logo.png" alt="Logo">
</div>

<div class="layout">

  <!-- ============ 사이드바 ============ -->
  <div th:replace="~{sidebar :: sidebar}"></div>

  <!-- ============ 오른쪽 전체(헤더 + 컨텐츠) ============ -->
  <div th:replace="~{header :: header}"></div>

    <!-- ============ 컨텐츠 ============ -->
    <main class="content">

      <!-- 프로필 카드 -->
      <section class="profile-card">

        <h2 class="card-title">Profile</h2>

        <div class="profile-body">

          <!-- 입력 폼 -->
          <form class="profile-form">

            <div class="form-group">
              <label for="id">아이디</label>
              <input type="text" id="id" placeholder="ID">
            </div>

            <div class="form-group">
              <label for="username">사용자 이름</label>
              <input type="text" id="username" placeholder="사용자 이름">
            </div>

            <div class="form-group">
              <label for="email">e - mail</label>
              <input type="email" id="email" placeholder="e - mail">
            </div>

            <div class="form-group">
              <label for="password">비밀번호</label>
              <div class="password-field">
                <input type="password" id="password" placeholder="password">
                <img src="/icons/eye.svg" alt="toggle password" class="eye-icon">
              </div>
            </div>

            <div class="form-group">
              <label for="password-check">비밀번호 확인</label>
              <div class="password-field">
                <input type="password" id="password-check" placeholder="password">
                <img src="/icons/eye.svg" alt="toggle password" class="eye-icon">
              </div>
            </div>

          </form>

          <!-- 프로필 사진 -->
          <div class="profile-photo">
            <img src="/photo/icon/profile-icon.png" alt="profile photo">
          </div>

        </div>

        <button type="submit" class="setting-btn">Setting</button>

      </section>

      <!-- 오른쪽 세로 배너 (틀만) -->
      <aside class="side-banner">
        <img src="/photo/side-banner.png" alt="brand banner">
      </aside>

    </main>

  </div>

</div>

<script src="/js/eye.js"></script>
</body>
</html>
