<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Building Info - Re I New</title>

    <link rel="stylesheet" th:href="@{/css/myteams.css}">
    <link rel="stylesheet" th:href="@{/css/header-sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/footer.css}">
    <link rel="stylesheet" th:href="@{/css/buildings.css}">
</head>
<body>
<div class="layout">
    <div th:replace="~{basic/sidebar :: sidebar}"></div>

    <div class="main-wrap">
        <div th:replace="~{basic/header :: header}"></div>

        <main class="main-content">
            <div class="building-page-header">
                <div>
                    <a class="back-link" th:href="@{/teams/{teamId}/buildings(teamId=${team.teamId})}">Building List</a>
                    <h2>Building Info</h2>
                    <p th:text="${team.teamName}">Team Name</p>
                </div>
                <div class="building-header-actions">
                    <a class="building-create-btn mqtt-register-link"
                       th:if="${team.myRole != null && team.myRole.isManager()}"
                       th:href="@{/teams/{teamId}/buildings/{buildingId}/mqtt(teamId=${team.teamId}, buildingId=${building.buildingId})}">
                        MQTT 등록
                    </a>
                    <div class="building-summary">
                        <span>Building ID</span>
                        <strong th:text="${building.buildingId}">0</strong>
                    </div>
                </div>
            </div>

            <section class="building-info-panel">
                <div class="building-info-main">
                    <div class="building-info-title">
                        <div class="building-icon">
                            <img src="/photo/icon/buidling-icon.png" alt="building">
                        </div>
                        <div>
                            <h3 th:text="${building.buildingName}">Building Name</h3>
                            <p th:text="${#strings.defaultString(building.description, '설명이 없습니다.')}">Description</p>
                        </div>
                    </div>

                    <dl class="building-detail-list">
                        <div>
                            <dt>Road Address</dt>
                            <dd th:text="${#strings.defaultString(building.roadAddress, '주소 정보 없음')}">Road Address</dd>
                        </div>
                        <div>
                            <dt>Detail Address</dt>
                            <dd th:text="${#strings.defaultString(building.detailAddress, '상세 주소 정보 없음')}">Detail Address</dd>
                        </div>
                        <div>
                            <dt>Region Name</dt>
                            <dd th:text="${#strings.defaultString(building.regionName, '지역 정보 없음')}">Region Name</dd>
                        </div>
                    </dl>
                </div>

                <div class="building-info-stats">
                    <div>
                        <span>Rooms</span>
                        <strong th:text="${building.roomCount}">0</strong>
                        <a class="stat-link"
                           th:href="@{/teams/{teamId}/buildings/{buildingId}/rooms(teamId=${team.teamId}, buildingId=${building.buildingId})}">
                            Classroom List
                        </a>
                    </div>
                    <div>
                        <span>Sensors</span>
                        <strong th:text="${building.sensorCount}">0</strong>
                    </div>
                    <div>
                        <span>Devices</span>
                        <strong th:text="${building.deviceCount}">0</strong>
                    </div>
                </div>
            </section>
        </main>
    </div>
</div>

<div th:replace="~{basic/footer :: footer}"></div>
</body>
</html>
