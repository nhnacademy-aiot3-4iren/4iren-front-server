

<!--<봇 이름>-->
<div th:fragment="telegram-bot(botType, botName)" class="telegram-bot-card">
  <span class="telegram-bot-label" th:text="${botName}">봇 이름</span>

<!--<연동 전 (초기화면)>-->
  <div th:id="'state-first-' + ${botType}" class="state-first-wrap">
    <span class="not-linked">연동되지 않음.</span>
    <div class="tele-btn">
      <div th:replace="~{/telegram/telebutton :: telebutton(${botType})}"></div>
    </div>
  </div>

<!--<연동 진행중>-->
  <div th:id="'state-pending-' + ${botType}" style="display: none">
    <p>Telegram에서 연동을 완료해 주세요.</p>
    <p class="deadtime-label">유효시간</p>
    <div th:replace="~{layout/timer :: circle-timer(${botType})}"></div>
  </div>


<!--<연동 성공>-->
  <div th:id="'state-success-' + ${botType}" class="state-container" style="display: none">
    <div class="success-wrap">
      <p class="state-text">연동되었습니다.</p>
      <img src="/photo/icon/check-icon.png" alt="check" class="check-icon-img">
    </div>
    <a th:id="'relinkBtn-' + ${botType}" class="aglinked-btn cursor-pointer">재연동하기</a>
  </div>

<!--<연동 실패(시간 만료)>-->
  <div th:id="'state-fail-' + ${botType}" class="state-container" style="display: none">
    <div class="fail-wrap">
      <p class="state-text">링크가 <span class="expiration">만료</span> 되었습니다.</p>
    </div>
    <a th:id="'retryBtn-' + ${botType}" class="aglinked-btn cursor-pointer">다시 연동하기</a>

    <div class="base-timer">
      <svg class="base-timer__svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <g class="base-timer__circle">
          <circle class="base-timer__path-elapsed" cx="50" cy="50" r="45"></circle>
          <path stroke-dasharray="283" class="base-timer__path-remaining red"
                d="M 50, 50 m -45, 0 a 45,45 0 1,0 90,0 a 45,45 0 1,0 -90,0"></path>
        </g>
      </svg>
      <span class="base-timer__label expiration">00:00</span>
    </div>
  </div>
</div>
