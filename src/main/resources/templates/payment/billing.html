<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>결제 관리 - Re I New</title>

  <link rel="stylesheet" href="/fonts/font.css">
  <link rel="stylesheet" href="/css/mypage/mypage-content.css">
  <link rel="stylesheet" th:href="@{/css/basic/footer.css}">
  <link rel="stylesheet" th:href="@{/css/basic/sidebar.css}">
  <link rel="stylesheet" th:href="@{/css/basic/header.css}">
  <link rel="stylesheet" th:href="@{/css/basic/main-content-area.css}">
  <link rel="stylesheet" th:href="@{/css/admin/admin_list.css}">
  <link rel="stylesheet" th:href="@{/css/payment.css}">
</head>

<body>
<div class="layout">

  <div th:replace="~{basic/sidebar :: sidebar}"></div>

  <div class="main-content-area">

    <div th:replace="~{basic/header :: header('결제 관리')}"></div>

    <main class="content">

      <div class="plan-page">

        <section class="profile-card">
          <h2 class="card-title">결제내역</h2>

          <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>결제일시</th>
                  <th>금액</th>
                  <th>상태</th>
                  <th>실패사유</th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="payment : ${payments}">
                  <td th:text="${#temporals.format(payment.attemptedAt(), 'yyyy-MM-dd HH:mm')}">2026-08-26 09:00</td>
                  <td th:text="${#numbers.formatInteger(payment.amount(), 0, 'COMMA')} + '원'">29,000원</td>
                  <td>
                    <span th:if="${payment.status() == 'DONE'}" class="status-badge status-active">성공</span>
                    <span th:if="${payment.status() == 'FAILED'}" class="status-badge status-withdrawn">실패</span>
                    <span th:if="${payment.status() == 'READY'}" class="status-badge status-pending">진행중</span>
                  </td>
                  <td th:text="${payment.failureReason() ?: '-'}">-</td>
                </tr>
                <tr th:if="${#lists.isEmpty(payments)}">
                  <td colspan="4" style="padding: 40px; color: #6c757d;">결제내역이 없습니다.</td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>

        <section class="profile-card">
          <h2 class="card-title">결제수단 변경</h2>
          <p class="notice-card-inline">변경한 결제수단은 다음 결제일부터 적용됩니다. 현재 이용 중인 결제수단으로는 계속 정상 청구됩니다.</p>

          <div class="pg-buttons">
            <form method="post" th:action="@{/payment/billing/change/toss}">
              <button type="submit" class="pg-button pg-toss">토스로 변경</button>
            </form>
            <form method="post" th:action="@{/payment/billing/change/kakao}">
              <button type="submit" class="pg-button pg-kakao">카카오페이로 변경</button>
            </form>
          </div>
        </section>

      </div>

    </main>
  </div>
</div>

<div th:replace="~{basic/footer :: footer}"></div>
</body>
</html>
