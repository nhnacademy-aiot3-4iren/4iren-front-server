<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>

    <!--font-->
    <link rel="stylesheet" href="/css/font.css">

    <!-- CSS -->
    <link rel="stylesheet" href="/css/account/forgotpw.css">
    <link rel="stylesheet" th:href="@{/css/basic/footer.css}">
</head>


<body>

<!-- 로딩 오버레이 -->
<div id="loadingOverlay">
    <div class="spinner"></div>
    <p>임시 비밀번호를 이메일로 전송 중입니다...</p>
</div>

<main class="forgot-wrapper">

<!-- 좌측 상단 로고 -->
<div class="brand-logo">
    <img src="/photo/logo-b.png" alt="Re I New Logo">
</div>

<!--물음표 이미지-->
<img src="/photo/login/forgot-girl.png" alt="forgot-girl" class="forgot-girl">

<!--입력 박스 (흰)-->
<div class="forgot-box">

    <div class="Main-text">
        <h1>Forgot Your Password?</h1>
    </div>
    <!--비번 입력칸-->
    <form action="/account/forgot" method="POST">

        <div class="enter-id">
            <label for="id">ID를 입력해 주세요.</label>
            <input type="text" id="id" name="loginId" placeholder="ID" required>
        </div>

        <div class="enter-id">
            <label for="email">e-mail 주소를 입력해 주세요.</label>
            <input type="email" id="email" name="email" placeholder="e-mail" required>
        </div>

        <p style="color: #ff4d4f; font-size: 0.9em; margin-top: 10px; margin-bottom: 10px; text-align: center;" th:if="${errorMessage}" th:text="${errorMessage}"></p>
        <p style="color: #52c41a; font-size: 0.9em; margin-top: 10px; margin-bottom: 10px; text-align: center;" th:if="${successMessage}" th:text="${successMessage}"></p>

        <button type="submit" class="verify-btn">Verify</button>
        <a href="/login" class="back-to-login">로그인 화면으로 돌아가기</a>
    </form>
</div>
</main>

<div th:replace="~{layout/footer :: footer}"></div>

<script src="/js/eye.js"></script>
<script>
    document.querySelector("form").addEventListener("submit", function() {
        document.getElementById("loadingOverlay").style.display = "flex";
        // 제출 버튼 비활성화 (중복 제출 방지)
        const btn = document.querySelector(".verify-btn");
        btn.disabled = true;
        btn.innerText = "전송 중...";
    });
</script>
</body>
</html>
