<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <!--font-->
    <link rel="stylesheet" href="/css/font.css">
    <!-- CSS -->
    <link rel="stylesheet" th:href="@{/css/basic/footer.css}">

    <!-- CSS -->
    <link rel="stylesheet" href="/css/account/signup.css">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="application-name" content="4iren">
</head>

<body>
<main class="signup-wrapper">
<!-- 좌측 상단 로고 -->
<div class="brand-logo">
    <img src="/photo/logo-b.png" alt="Re I New Logo">
</div>

<!-- 왼쪽 캐릭터 -->
<img src="/photo/login/login-phonegirl.png" alt="Floating Character" class="floating-charc">
<div class="weather-widget">
    <div class="weather-row">
        <img src="/photo/login/alaram.png" alt="alaram widget" class="alaram">
    </div>
</div>

<!-- 오른쪽 캐릭터 -->
<img src="/photo/login/login-studygirl.png" alt="Study Character" class="study-charc">

<!-- 회원가입 박스 -->
<div class="signup-box">

    <div class="sign-header">
        <div class="signin-box">
            <p class="have-acc">Have an Account ?</p>
            <a href="../login" class="signin-link">Sign in</a>
        </div>
    </div>

        <!--메인 글씨 Sign up-->
        <div class="title-container">
            <h1>Sign Up</h1>
            <span class="subtitle">회원가입</span>
        </div>

        <!--회원가입 입력칸-->
        <form th:action="@{/signup}" method="POST">
            <div class="enterid">
                <label for="loginId">사용할 ID를 입력하세요</label>
                <input type="text" id="loginId" name="loginId" placeholder="사용할 아이디" required>
            </div>

        <!--사용자 이름 & e-mail 입력칸-->
        <div class="ne-input">
            <div class="name-email">
            <label for="name">사용자 이름</label>
                <input type="text" id="name" name="name" placeholder="사용자 이름" required>
            </div>

            <div class="name-email">
            <label for="email">e-mail</label>
                <input type="email" id="email" name="email" placeholder="e-mail" required>
            </div>
        </div>

        <div class="pw-box">
            <label for="password">사용할 비밀번호를 입력하세요.</label>
            <div class="password-wrapper">
                <input type="password" id="password" name="password" placeholder="비밀번호" required>
                <img src="/photo/icon/pw-eye.png" alt="비밀번호 보기" class="eye-icon-c" id="eye-icon">
            </div>
        </div>


            <button type="submit" class="signup-btn">Sign up</button>
        </form>
</div>
</main>

<!--Footer-->
<div th:replace="~{layout/footer :: footer}"></div>

<script src="/js/eye.js"></script>
</body>
</html>
