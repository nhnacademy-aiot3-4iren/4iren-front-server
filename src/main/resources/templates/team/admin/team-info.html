<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Info</title>

    <link rel="stylesheet" href="/fonts/font.css">
    <link rel="stylesheet" th:href="@{/css/myteams.css}">
    <!-- 공통 CSS -->
    <link rel="stylesheet" th:href="@{/css/basic/footer.css}">
    <link rel="stylesheet" th:href="@{/css/basic/sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/basic/header.css}">
    <link rel="stylesheet" th:href="@{/css/team-info.css}">
    <link rel="stylesheet" th:href="@{/css/basic/main-content-area.css}">
</head>
<body>

<div class="layout">

    <!-- 사이드바 -->
    <div th:replace="~{basic/sidebar :: sidebar}"></div>

    <div class="main-wrap">

        <!-- 헤더 -->
        <div th:replace="~{basic/header :: header('Team Info')}"></div>

        <!-- 메인 컨텐츠 -->
        <div class="main-content">

            <!-- 하얀색 메인 둥근 배경 박스 -->
            <div class="info-card-container">

                <!-- ============================================== -->
                <!-- 왼쪽: 팀 정보 수정 영역 -->
                <!-- ============================================== -->
                <div class="info-left-panel">
                    <div class="info-header">
                        <h2>Team Info</h2>
                        <span class="role-admin" th:text="${team.myRole}">Admin</span>
                    </div>

                    <div class="input-section">
                        <div class="form-group">
                            <label>TEAM NAME</label>
                            <div class="input-wrapper">
                                <input type="text" id="editTeamName" th:value="${team.teamName}">
                                <button type="button" class="clear-btn" id="clearNameBtn">
                                    <img src="/photo/icon/remove-icon.png" alt="clear" id="clearIcon">
                                </button>
                            </div>
                        </div>

                        <div class="form-group">
                            <label>DESCRIPTION</label>
                            <textarea id="editTeamDesc" placeholder="Enter about space ..." th:text="${team.description}"></textarea>
                        </div>
                    </div>

                    <button class="btn-save" id="saveTeamInfoBtn"
                            th:if="${team.myRole != null && team.myRole.isManager()}">Team Info Save</button>
                </div>

                <!-- ============================================== -->
                <!-- 오른쪽: 통계 및 구성원 정보 영역 (백엔드 데이터) -->
                <!-- ============================================== -->
                <div class="info-right-panel">

                    <!-- 소속 공간 박스 -->
                    <div class="stat-card">
                        <div class="stat-header">
                            <div>
                                <h3>belonging</h3>
                                <span class="sub-text">Space 소속 공간</span>
                            </div>
                            <a class="btn-building-list" th:href="@{/teams/{teamId}/buildings(teamId=${team.teamId})}">
                                <img src="/photo/icon/arrow-icon.png" alt="go"> Building List
                            </a>
                        </div>

                        <div class="stat-boxes">
                            <div class="stat-box">
                                <span class="stat-label">Buildings</span>
                                <div class="stat-value" th:text="|총 ${team.buildingCount}개|">총 0개</div>
                            </div>
                            <div class="stat-box">
                                <span class="stat-label">Classroom</span>
                                <div class="stat-value" th:text="|총 ${team.roomCount}개|">총 0개</div>
                            </div>
                        </div>
                    </div>

                    <!-- 구성원 박스 -->
                    <div class="stat-card">
                        <div class="stat-header">
                            <div>
                                <h3>Team Member</h3>
                                <span class="sub-text">구성원</span>
                            </div>
                        </div>
                        <div class="member-info">
                            <div class="member-icon-circle">
                                <img src="/photo/icon/team-member-i.png" alt="team">
                            </div>
                            <div class="member-count-box">
                                <span class="member-label">Total Members</span>
                                <span class="member-number" th:text="${team.memberCount}">0</span>
                            </div>
                        </div>
                    </div>

                </div> <!-- <info-right-panel -->
            </div> <!-- < info-card-container -->

        </div> <!-- <main-content -->
    </div> <!-- < main-wrap -->
</div> <!-- < layout -->


<!-- Js-->
<script th:inline="javascript">
    const teamId = /*[[${team.teamId}]]*/ null;
    const editTeamName = document.getElementById('editTeamName');
    const clearNameBtn = document.getElementById('clearNameBtn');
    const saveTeamInfoBtn = document.getElementById('saveTeamInfoBtn');
    const editTeamDesc = document.getElementById('editTeamDesc');

    // 입력창에 내용이 있을 때만 X 버튼 보이기
    function toggleClearButton() {
        if (editTeamName.value.length > 0) {
            clearNameBtn.style.display = 'block';
        } else {
            clearNameBtn.style.display = 'none';
        }
    }

    // 첫 로드 시 버튼 표시 여부 확인
    toggleClearButton();

    // 입력창에 글자를 칠 때마다 확인
    editTeamName.addEventListener('input', toggleClearButton);

    // X 버튼 클릭 시 텍스트 모두 지우기
    clearNameBtn.addEventListener('click', () => {
        editTeamName.value = '';
        toggleClearButton();
        editTeamName.focus(); // 지운 후 다시 입력할 수 있게 커서 활성화
    });

    if (saveTeamInfoBtn) {
    saveTeamInfoBtn.addEventListener('click', async () => {
        const updatedName = editTeamName.value.trim();
        const updatedDesc = editTeamDesc.value.trim();

        if (!updatedName) {
            alert("팀 이름을 입력해주세요.");
            return;
        }

        try {
            const response = await fetch(`/api/front/teams/${teamId}`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    teamName: updatedName,
                    description: updatedDesc
                })
            });

            if (!response.ok) {
                throw new Error(await response.text());
            }

            alert("팀 정보가 성공적으로 수정되었습니다!");
            window.location.href = '/team';
        } catch (error) {
            alert(error.message || "팀 정보 수정에 실패했습니다.");
        }
    });
    }
</script>

<div th:replace="~{basic/footer :: footer}"></div>
</body>
</html>
