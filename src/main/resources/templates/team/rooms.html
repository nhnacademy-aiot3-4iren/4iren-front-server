<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classroom List - Re I New</title>

    <link rel="stylesheet" href="/fonts/font.css">
    <link rel="stylesheet" th:href="@{/css/basic/layout.css}">
    <link rel="stylesheet" th:href="@{/css/basic/sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/basic/header.css}">
    <link rel="stylesheet" th:href="@{/css/basic/main-content-area.css}">
    <link rel="stylesheet" th:href="@{/css/basic/footer.css}">
    <link rel="stylesheet" th:href="@{/css/myteams.css}">
    <link rel="stylesheet" th:href="@{/css/sidebarmenu/team/bulidings/buildings.css}">
    <link rel="stylesheet" th:href="@{/css/team/buildings.css}">

    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="application-name" content="4iren">
</head>
<body>
<div class="layout">
    <div th:replace="~{layout/sidebar :: sidebar}"></div>

    <div class="main-content-area">
        <div th:replace="~{layout/header :: header('Rooms')}"></div>
        <main class="content">

            <!-- 페이지 상단 헤더: 상위 건물 정보 및 강의실 추가 모달 트리거 -->
            <div class="building-page-header">
                <div>
                    <a class="back-link"
                       th:href="@{/teams/{teamId}/buildings/{buildingId}(teamId=${team.teamId}, buildingId=${building.buildingId})}">
                        Building Info
                    </a>
                    <h2>Classroom List</h2>
                    <p>
                        <span th:text="${team.teamName}">Team Name</span>
                        <span> / </span>
                        <span th:text="${building.buildingName}">Building Name</span>
                    </p>
                </div>
                <div class="building-header-actions">
                    <div class="building-summary">
                        <span>Classrooms</span>
                        <strong th:text="${rooms.totalElements}">0</strong>
                    </div>
                    <!-- 매니저 권한이 있을 때만 강의실 등록 모달 버튼 노출 -->
                    <button class="building-create-btn" type="button" id="openRoomModalBtn"
                            th:if="${team.myRole != null && team.myRole.isManager()}">+ Classroom 생성</button>
                </div>
            </div>

            <!-- 강의실 목록 테이블/카드 영역 (데이터가 있을 때만 렌더링) -->
            <section class="building-list-panel" th:if="${!#lists.isEmpty(rooms.content)}">
                <!-- 반복문을 통해 각 강의실(room) 정보를 카드로 렌더링 -->
                <article class="building-row room-row" th:each="room : ${rooms.content}"
                         th:with="subscription=${roomSubscriptionStatuses[room.roomId]}">
                    <div class="building-main">
                        <div class="building-icon room-icon">
                            <img src="/photo/icon/door-icon.png" alt="classroom">
                        </div>
                        <div>
                            <h3 th:text="${room.roomName}">Classroom Name</h3>
                            <p th:text="${#strings.defaultString(room.description, '등록된 설명이 없습니다.')}">Description</p>
                            <address th:text="${#strings.defaultString(room.buildingName, building.buildingName)}">
                                Building Name
                            </address>
                        </div>
                    </div>

                    <!-- 하위 자산 통계 -->
                    <div class="building-stats room-stats">
                        <div>
                            <span>Sensors</span>
                            <strong th:text="${room.sensorCount}">0</strong>
                        </div>
                        <div>
                            <span>Devices</span>
                            <strong th:text="${room.deviceCount}">0</strong>
                        </div>
                    </div>

                    <!-- 강의실 동작 버튼 (구독 토글, 상세 이동, 삭제) -->
                    <div class="room-actions">
                        <section class="room-subscription-controls" th:attr="data-room-id=${room.roomId}">
                            <p class="room-subscription-text"
                               th:text="${subscription.subscribed} ? '구독 중' : '미구독'">구독 상태</p>
                            <div class="room-subscription-actions">
                                <label class="notification-toggle compact"
                                       th:classappend="${!subscription.subscribed} ? 'disabled'">
                                    <input type="checkbox" class="room-notification-toggle"
                                           th:checked="${subscription.notificationEnabled}"
                                           th:disabled="${!subscription.subscribed}">
                                    <span></span>
                                    <strong>알림</strong>
                                </label>
                                <button class="subscription-btn subscribe room-subscribe-btn" type="button"
                                        th:if="${team.myRole != null && team.myRole.name() == 'NORMAL'}"
                                        th:style="${subscription.subscribed} ? 'display:none' : ''">
                                    구독
                                </button>
                                <button class="subscription-btn unsubscribe room-unsubscribe-btn" type="button"
                                        th:if="${team.myRole != null && team.myRole.name() == 'NORMAL'}"
                                        th:style="${subscription.subscribed} ? '' : 'display:none'">
                                    구독 취소
                                </button>
                            </div>
                        </section>
                        <a class="building-detail-link"
                           th:href="@{/teams/{teamId}/buildings/{buildingId}/rooms/{roomId}(teamId=${team.teamId}, buildingId=${building.buildingId}, roomId=${room.roomId})}">
                            상세 보기
                        </a>
                        <button class="asset-delete-btn room-delete-btn" type="button"
                                th:if="${team.myRole != null && team.myRole.isManager()}"
                                th:attr="data-room-id=${room.roomId},data-room-name=${room.roomName}">
                            삭제
                        </button>
                    </div>
                </article>
            </section>

            <!-- 등록된 강의실이 없을 때 표시되는 빈 상태(Empty State) -->
            <div class="empty-state building-empty" th:if="${#lists.isEmpty(rooms.content)}">
                <p>등록된 강의실이 없습니다.</p>
            </div>

            <!-- 페이징 네비게이션 (2페이지 이상 존재할 때만 표시) -->
            <nav class="building-pagination" th:if="${rooms.totalPages > 1}">
                <a th:classappend="${rooms.first} ? 'disabled'"
                   th:href="@{/teams/{teamId}/buildings/{buildingId}/rooms(teamId=${team.teamId}, buildingId=${building.buildingId}, page=${rooms.page - 1}, size=${size}, sort=${sort})}">
                    Previous
                </a>
                <span th:text="|${rooms.page + 1} / ${rooms.totalPages}|">1 / 1</span>
                <a th:classappend="${rooms.last} ? 'disabled'"
                   th:href="@{/teams/{teamId}/buildings/{buildingId}/rooms(teamId=${team.teamId}, buildingId=${building.buildingId}, page=${rooms.page + 1}, size=${size}, sort=${sort})}">
                    Next
                </a>
            </nav>

            <!-- 강의실 신규 등록 팝업 모달 -->
            <div class="modal-overlay" id="roomModalOverlay">
                <div class="modal-folder-wrapper building-modal">
                    <div class="modal-tab">Classroom 생성</div>
                    <div class="modal-content">
                        <div class="building-form-group">
                            <label>Classroom Name</label>
                            <input type="text" id="roomNameInput" placeholder="ex ) 301호">
                        </div>
                        <div class="building-form-group">
                            <label>Description</label>
                            <textarea id="roomDescInput" placeholder="강의실 설명을 입력히세요."></textarea>
                        </div>
                        <div class="building-modal-actions">
                            <button class="modal-cancel-btn" type="button" id="closeRoomModalBtn">Cancel</button>
                            <button class="modal-submit-btn" type="button" id="createRoomBtn">Create</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<div th:replace="~{layout/footer :: footer}"></div>

<!-- rooms.js에서 사용할 전역 변수 설정 -->
<script th:inline="javascript">
    const teamId = /*[[${team.teamId}]]*/ null;
    const buildingId = /*[[${building.buildingId}]]*/ null;
</script>
<script src="/js/rooms.js"></script>
</body>
</html>
