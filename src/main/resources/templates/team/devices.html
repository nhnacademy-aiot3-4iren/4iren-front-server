<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Device List - Re I New</title>

    <link rel="stylesheet" href="/fonts/font.css">
    <link rel="stylesheet" th:href="@{/css/basic/layout.css}">
    <link rel="stylesheet" th:href="@{/css/basic/sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/basic/header.css}">
    <link rel="stylesheet" th:href="@{/css/basic/main-content-area.css}">
    <link rel="stylesheet" th:href="@{/css/basic/footer.css}">
    <link rel="stylesheet" th:href="@{/css/myteams.css}">
    <link rel="stylesheet" th:href="@{/css/team/buildings.css}">

    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="application-name" content="4iren">
</head>
<body>
<div class="layout">
    <div th:replace="~{layout/sidebar :: sidebar}"></div>

    <div class="main-content-area">
        <div th:replace="~{layout/header :: header('Devices')}"></div>
        <main class="content">

            <!-- 상단 헤더: 이전 강의실 화면 링크 및 디바이스 추가 버튼 -->
            <div class="building-page-header">
                <div>
                    <a class="back-link"
                       th:href="@{/teams/{teamId}/buildings/{buildingId}/rooms/{roomId}(teamId=${team.teamId}, buildingId=${building.buildingId}, roomId=${room.roomId})}">
                        Classroom Info
                    </a>
                    <h2>Device List</h2>
                    <p th:text="${room.roomName}">Classroom Name</p>
                </div>
                <div class="building-header-actions">
                    <div class="building-summary">
                        <span>Devices</span>
                        <strong th:text="${devices.totalElements}">0</strong>
                    </div>
                    <button class="building-create-btn" type="button" id="openDeviceModalBtn"
                            th:if="${team.myRole != null && team.myRole.isManager()}">+ Device 추가</button>
                </div>
            </div>

            <!-- 디바이스(제어기 등) 목록 렌더링 -->
            <section class="building-list-panel" th:if="${!#lists.isEmpty(devices.content)}">
                <article class="building-row asset-row" th:each="device : ${devices.content}">
                    <div class="building-main">
                        <div class="building-icon asset-icon">
                            <img src="/photo/icon/node-icon.png" alt="device">
                        </div>
                        <div>
                            <h3 th:text="${device.deviceName}">Device Name</h3>
                            <p th:text="|Device ID ${device.deviceId}|">Device ID</p>
                            <p>
                                전원 상태:
                                <strong class="device-action-text" th:text="${device.action}">OFF</strong>
                            </p>
                            <address th:text="${room.roomName}">Classroom Name</address>
                        </div>
                    </div>
                    <div class="asset-actions">
                        <button class="asset-delete-btn device-delete-btn" type="button"
                                th:if="${team.myRole != null && team.myRole.isManager()}"
                                th:attr="data-device-id=${device.deviceId},data-device-name=${device.deviceName}">
                            삭제
                        </button>
                    </div>
                </article>
            </section>

            <!-- 빈 목록 안내 -->
            <div class="empty-state building-empty" th:if="${#lists.isEmpty(devices.content)}">
                <p>등록된 디바이스가 없습니다.</p>
            </div>

            <!-- 페이징 영역 -->
            <nav class="building-pagination" th:if="${devices.totalPages > 1}">
                <a th:classappend="${devices.first} ? 'disabled'"
                   th:href="@{/teams/{teamId}/buildings/{buildingId}/rooms/{roomId}/devices(teamId=${team.teamId}, buildingId=${building.buildingId}, roomId=${room.roomId}, page=${devices.page - 1}, size=${size}, sort=${sort})}">
                    Previous
                </a>
                <span th:text="|${devices.page + 1} / ${devices.totalPages}|">1 / 1</span>
                <a th:classappend="${devices.last} ? 'disabled'"
                   th:href="@{/teams/{teamId}/buildings/{buildingId}/rooms/{roomId}/devices(teamId=${team.teamId}, buildingId=${building.buildingId}, roomId=${room.roomId}, page=${devices.page + 1}, size=${size}, sort=${sort})}">
                    Next
                </a>
            </nav>

            <!-- 디바이스 등록 모달 -->
            <div class="modal-overlay" id="deviceModalOverlay">
                <div class="modal-folder-wrapper building-modal">
                    <div class="modal-tab">Device 추가</div>
                    <div class="modal-content">
                        <div class="building-form-group">
                            <label>Device Name</label>
                            <input type="text" id="deviceNameInput" placeholder="ex ) 에어컨 제어기">
                        </div>
                        <div class="building-modal-actions">
                            <button class="modal-cancel-btn" type="button" id="closeDeviceModalBtn">Cancel</button>
                            <button class="modal-submit-btn" type="button" id="createDeviceBtn">Create</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<div th:replace="~{layout/footer :: footer}"></div>

<!-- devices.js에서 사용할 변수 -->
<script th:inline="javascript">
    const teamId = /*[[${team.teamId}]]*/ null;
    const roomId = /*[[${room.roomId}]]*/ null;
</script>
<script src="/js/devices.js"></script>
</body>
</html>
