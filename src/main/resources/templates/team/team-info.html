<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Team Info</title>
    <link rel="stylesheet" href="/fonts/font.css">
    <link rel="stylesheet" th:href="@{/css/basic/footer.css}">
    <link rel="stylesheet" th:href="@{/css/basic/sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/basic/header.css}">
    <link rel="stylesheet" th:href="@{/css/basic/main-content-area.css}">
    <link rel="stylesheet" th:href="@{/css/basic/layout.css}">
    <link rel="stylesheet" th:href="@{/css/team/team-info.css}">
</head>
<body>
<div class="layout">
    <div th:replace="~{layout/sidebar :: sidebar}"></div>
    <div class="main-content-area">
        <div th:replace="~{layout/header :: header('Team Info')}"></div>
        <main class="content">
            <div class="info-cards-row">
                <div class="info-card info-left-panel">
                    <div class="info-header">
                        <h2>Team Info</h2>
                        <span class="role-admin" th:text="${team.myRole}">Admin</span>
                    </div>

                    <div class="input-section">
                        <div class="form-group">
                            <label for="editTeamName">TEAM NAME</label>
                            <div class="input-wrapper">
                                <input type="text" id="editTeamName" th:value="${team.teamName}"
                                       th:readonly="${team.myRole == null || !team.myRole.isManager()}">
                                <button type="button" class="clear-btn" id="clearNameBtn"
                                        th:if="${team.myRole != null && team.myRole.isManager()}">
                                    <img src="/photo/icon/signout-icon.png" alt="clear" id="clearIcon">
                                </button>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="editTeamDesc">DESCRIPTION</label>
                            <textarea id="editTeamDesc" placeholder="Enter about space ..." th:text="${team.description}"
                                      th:readonly="${team.myRole == null || !team.myRole.isManager()}"></textarea>
                        </div>
                    </div>

                    <button class="btn-save" id="saveTeamInfoBtn"
                            th:if="${team.myRole != null && team.myRole.isManager()}">Team Info Save</button>

                    <div class="info-section-divider"></div>

                    <div class="stat-card stat-card-flat">
                        <div class="stat-header">
                            <h3>Team Member</h3>
                            <span class="sub-text">구성원</span>
                        </div>
                        <div class="member-info">
                            <div class="member-icon-circle">
                                <img src="/photo/icon/team-member-i.png" alt="team">
                            </div>
                            <div class="member-count-box">
                                <span class="member-label">Total Members</span>
                                <span class="member-number" th:text="${team.memberCount}">0</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Building/Classroom split -->
                <div class="info-card info-lists-panel"
                     th:data-team-id="${team.teamId}"
                     th:data-can-manage="${team.myRole != null && team.myRole.isManager()}">
                    <div class="lists-split">
                        <div class="list-half">
                            <div class="list-half-header">
                                <h3>Building List</h3>
                                <span class="sub-text">Team에 소속된 건물 리스트</span>
                            </div>
                            <ul class="entity-list" id="buildingList">
                                <li class="entity-list-empty">불러오는 중입니다...</li>
                            </ul>
                            <div class="list-actions" th:if="${team.myRole != null && team.myRole.isManager()}">
                                <button type="button" class="btn-outline-sm" id="addBuildingBtn">+ 추가</button>
                                <button type="button" class="btn-outline-sm btn-danger-outline" id="deleteBuildingBtn" disabled>삭제</button>
                            </div>
                        </div>
                        <div class="list-divider"></div>
                        <div class="list-half">
                            <div class="list-half-header">
                                <h3 id="classroomListTitle">Classroom List</h3>
                                <span class="sub-text" id="classroomListSubtitle">건물을 선택하면 강의실 목록이 표시됩니다</span>
                            </div>
                            <ul class="entity-list" id="classroomList">
                                <li class="entity-list-empty">왼쪽에서 건물을 선택하세요.</li>
                            </ul>
                            <div class="list-actions" id="classroomActions" style="display:none;">
                                <button type="button" class="btn-outline-sm" id="addRoomBtn">+ 추가</button>
                                <button type="button" class="btn-outline-sm btn-danger-outline" id="deleteRoomBtn" disabled>삭제</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<dialog class="modal" id="addBuildingModal">
    <div class="modal-header">
        <h2>건물 추가</h2>
        <button type="button" class="modal-close" id="addBuildingModalCloseBtn">&times;</button>
    </div>
    <div class="modal-body">
        <label class="modal-field-label" for="newBuildingName">건물 이름</label>
        <input type="text" id="newBuildingName" placeholder="예) 본관">
        <label class="modal-field-label" for="newBuildingDesc">설명</label>
        <input type="text" id="newBuildingDesc" placeholder="선택 입력">
        <label class="modal-field-label" for="newBuildingRegion">지역명</label>
        <input type="text" id="newBuildingRegion" placeholder="예) 광주광역시">
        <label class="modal-field-label" for="newBuildingRoadAddress">도로명 주소</label>
        <input type="text" id="newBuildingRoadAddress" placeholder="선택 입력">
        <label class="modal-field-label" for="newBuildingDetailAddress">상세 주소</label>
        <input type="text" id="newBuildingDetailAddress" placeholder="선택 입력">
        <p class="form-error" id="addBuildingError"></p>
        <div class="modal-actions">
            <button type="button" class="btn-outline" id="addBuildingCancelBtn">취소</button>
            <button type="button" class="btn-primary" id="addBuildingSubmitBtn">추가</button>
        </div>
    </div>
</dialog>

<dialog class="modal" id="addRoomModal">
    <div class="modal-header">
        <h2>강의실 추가</h2>
        <button type="button" class="modal-close" id="addRoomModalCloseBtn">&times;</button>
    </div>
    <div class="modal-body">
        <label class="modal-field-label" for="newRoomName">강의실 이름</label>
        <input type="text" id="newRoomName" placeholder="예) 301호">
        <label class="modal-field-label" for="newRoomDesc">설명</label>
        <input type="text" id="newRoomDesc" placeholder="선택 입력">
        <p class="form-error" id="addRoomError"></p>
        <div class="modal-actions">
            <button type="button" class="btn-outline" id="addRoomCancelBtn">취소</button>
            <button type="button" class="btn-primary" id="addRoomSubmitBtn">추가</button>
        </div>
    </div>
</dialog>

<div th:replace="~{layout/footer :: footer}"></div>

<script th:inline="javascript">
    const teamId = /*[[${team.teamId}]]*/ null;
    const canManage = /*[[${team.myRole != null && team.myRole.isManager()}]]*/ false;

    const editTeamName = document.getElementById('editTeamName');
    const clearNameBtn = document.getElementById('clearNameBtn');
    const saveTeamInfoBtn = document.getElementById('saveTeamInfoBtn');
    const editTeamDesc = document.getElementById('editTeamDesc');

    if (clearNameBtn) {
        function toggleClearButton() {
            clearNameBtn.style.display = editTeamName.value.length > 0 ? 'flex' : 'none';
        }
        toggleClearButton();
        editTeamName.addEventListener('input', toggleClearButton);
        clearNameBtn.addEventListener('click', () => {
            editTeamName.value = '';
            toggleClearButton();
            editTeamName.focus();
        });
    }

    if (saveTeamInfoBtn) {
        saveTeamInfoBtn.addEventListener('click', async () => {
            const updatedName = editTeamName.value.trim();
            const updatedDesc = editTeamDesc.value.trim();
            if (!updatedName) { alert("팀 이름을 입력해주세요."); return; }
            try {
                const response = await fetch(`/api/front/teams/${teamId}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ teamName: updatedName, description: updatedDesc })
                });
                if (!response.ok) throw new Error(await response.text());
                alert("팀 정보가 성공적으로 수정되었습니다!");
                window.location.reload();
            } catch (error) {
                alert(error.message || "팀 정보 수정에 실패했습니다.");
            }
        });
    }

    const buildingListEl = document.getElementById('buildingList');
    const classroomListEl = document.getElementById('classroomList');
    const classroomListTitle = document.getElementById('classroomListTitle');
    const classroomListSubtitle = document.getElementById('classroomListSubtitle');
    const classroomActions = document.getElementById('classroomActions');
    const addBuildingBtn = document.getElementById('addBuildingBtn');
    const deleteBuildingBtn = document.getElementById('deleteBuildingBtn');
    const addRoomBtn = document.getElementById('addRoomBtn');
    const deleteRoomBtn = document.getElementById('deleteRoomBtn');

    let selectedBuildingId = null;
    let selectedRoomId = null;

    async function requestJson(url, options = {}) {
        const response = await fetch(url, {
            headers: { 'Content-Type': 'application/json', ...(options.headers || {}) },
            ...options
        });
        if (!response.ok) throw new Error((await response.text()) || `요청 실패 (${response.status})`);
        if (response.status === 204) return null;
        return response.json();
    }

    async function loadBuildings() {
        buildingListEl.innerHTML = '<li class="entity-list-empty">불러오는 중입니다...</li>';
        try {
            const result = await requestJson(`/api/front/teams/${teamId}/buildings?size=100&sort=id,ASC`);
            renderBuildings(result.content || []);
        } catch (error) {
            buildingListEl.innerHTML = `<li class="entity-list-empty">${error.message || '건물 목록을 불러오지 못했습니다.'}</li>`;
        }
    }

    function renderBuildings(buildings) {
        if (buildings.length === 0) {
            buildingListEl.innerHTML = '<li class="entity-list-empty">등록된 건물이 없습니다.</li>';
            return;
        }
        buildingListEl.innerHTML = buildings.map(b => `
            <li class="entity-list-item" data-building-id="${b.buildingId}">
                <span class="entity-name">${escapeHtml(b.buildingName)}</span>
            </li>`).join('');
        buildingListEl.querySelectorAll('.entity-list-item').forEach(li => {
            li.addEventListener('click', () => selectBuilding(Number(li.dataset.buildingId), li));
        });
    }

    function selectBuilding(buildingId, liEl) {
        selectedBuildingId = buildingId;
        selectedRoomId = null;
        buildingListEl.querySelectorAll('.entity-list-item').forEach(li => li.classList.remove('selected'));
        liEl.classList.add('selected');
        if (deleteBuildingBtn) deleteBuildingBtn.disabled = false;
        if (deleteRoomBtn) deleteRoomBtn.disabled = true;
        loadRooms(buildingId);
    }

    async function loadRooms(buildingId) {
        const selectedName = buildingListEl.querySelector('.entity-list-item.selected .entity-name')?.textContent || '';
        classroomListTitle.textContent = 'Classroom List';
        classroomListSubtitle.textContent = `${selectedName}에 소속된 강의실 리스트`;
        classroomListEl.innerHTML = '<li class="entity-list-empty">불러오는 중입니다...</li>';
        if (canManage) classroomActions.style.display = 'flex';
        try {
            const result = await requestJson(`/api/front/teams/${teamId}/buildings/${buildingId}/rooms?size=100&sort=id,ASC`);
            renderRooms(result.content || []);
        } catch (error) {
            classroomListEl.innerHTML = `<li class="entity-list-empty">${error.message || '강의실 목록을 불러오지 못했습니다.'}</li>`;
        }
    }

    function renderRooms(rooms) {
        if (rooms.length === 0) {
            classroomListEl.innerHTML = '<li class="entity-list-empty">등록된 강의실이 없습니다.</li>';
            return;
        }
        classroomListEl.innerHTML = rooms.map(r => `
            <li class="entity-list-item" data-room-id="${r.roomId}">
                <span class="entity-name">${escapeHtml(r.roomName)}</span>
            </li>`).join('');
        classroomListEl.querySelectorAll('.entity-list-item').forEach(li => {
            li.addEventListener('click', () => {
                classroomListEl.querySelectorAll('.entity-list-item').forEach(el => el.classList.remove('selected'));
                li.classList.add('selected');
                selectedRoomId = Number(li.dataset.roomId);
                if (deleteRoomBtn) deleteRoomBtn.disabled = false;
            });
        });
    }

    const addBuildingModal = document.getElementById('addBuildingModal');
    if (addBuildingBtn) addBuildingBtn.addEventListener('click', () => addBuildingModal.showModal());
    document.getElementById('addBuildingModalCloseBtn')?.addEventListener('click', () => addBuildingModal.close());
    document.getElementById('addBuildingCancelBtn')?.addEventListener('click', () => addBuildingModal.close());

    document.getElementById('addBuildingSubmitBtn')?.addEventListener('click', async () => {
        const errorEl = document.getElementById('addBuildingError');
        const buildingName = document.getElementById('newBuildingName').value.trim();
        if (!buildingName) { errorEl.textContent = '건물 이름을 입력해주세요.'; return; }
        try {
            await requestJson(`/api/front/teams/${teamId}/buildings`, {
                method: 'POST',
                body: JSON.stringify({
                    buildingName,
                    description: document.getElementById('newBuildingDesc').value.trim(),
                    regionName: document.getElementById('newBuildingRegion').value.trim(),
                    roadAddress: document.getElementById('newBuildingRoadAddress').value.trim(),
                    detailAddress: document.getElementById('newBuildingDetailAddress').value.trim()
                })
            });
            addBuildingModal.close();
            errorEl.textContent = '';
            await loadBuildings();
        } catch (error) {
            errorEl.textContent = error.message || '건물 추가에 실패했습니다.';
        }
    });

    if (deleteBuildingBtn) {
        deleteBuildingBtn.addEventListener('click', async () => {
            if (!selectedBuildingId) return;
            if (!confirm('선택한 건물을 삭제하시겠습니까? 강의실이 있는 건물은 삭제할 수 없습니다.')) return;
            try {
                await requestJson(`/api/front/teams/${teamId}/buildings/${selectedBuildingId}`, { method: 'DELETE' });
                selectedBuildingId = null;
                deleteBuildingBtn.disabled = true;
                classroomListEl.innerHTML = '<li class="entity-list-empty">왼쪽에서 건물을 선택하세요.</li>';
                classroomListSubtitle.textContent = '건물을 선택하면 강의실 목록이 표시됩니다';
                classroomActions.style.display = 'none';
                await loadBuildings();
            } catch (error) {
                alert(error.message || '건물 삭제에 실패했습니다. (강의실이 남아있지 않은지 확인해주세요)');
            }
        });
    }

    const addRoomModal = document.getElementById('addRoomModal');
    if (addRoomBtn) {
        addRoomBtn.addEventListener('click', () => {
            if (!selectedBuildingId) { alert('먼저 왼쪽에서 건물을 선택해주세요.'); return; }
            addRoomModal.showModal();
        });
    }
    document.getElementById('addRoomModalCloseBtn')?.addEventListener('click', () => addRoomModal.close());
    document.getElementById('addRoomCancelBtn')?.addEventListener('click', () => addRoomModal.close());

    document.getElementById('addRoomSubmitBtn')?.addEventListener('click', async () => {
        const errorEl = document.getElementById('addRoomError');
        const roomName = document.getElementById('newRoomName').value.trim();
        if (!roomName) { errorEl.textContent = '강의실 이름을 입력해주세요.'; return; }
        try {
            await requestJson(`/api/front/teams/${teamId}/buildings/${selectedBuildingId}/rooms`, {
                method: 'POST',
                body: JSON.stringify({
                    roomName,
                    description: document.getElementById('newRoomDesc').value.trim()
                })
            });
            addRoomModal.close();
            errorEl.textContent = '';
            await loadRooms(selectedBuildingId);
        } catch (error) {
            errorEl.textContent = error.message || '강의실 추가에 실패했습니다.';
        }
    });

    if (deleteRoomBtn) {
        deleteRoomBtn.addEventListener('click', async () => {
            if (!selectedRoomId) return;
            if (!confirm('선택한 강의실을 삭제하시겠습니까?')) return;
            try {
                await requestJson(`/api/front/teams/${teamId}/buildings/${selectedBuildingId}/rooms/${selectedRoomId}`, { method: 'DELETE' });
                selectedRoomId = null;
                deleteRoomBtn.disabled = true;
                await loadRooms(selectedBuildingId);
            } catch (error) {
                alert(error.message || '강의실 삭제에 실패했습니다.');
            }
        });
    }

    function escapeHtml(value) {
        return String(value)
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#039;');
    }

    document.addEventListener('DOMContentLoaded', loadBuildings);
</script>
</body>
</html>
