<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Members</title>

    <link rel="stylesheet" href="/fonts/font.css">
    <link rel="stylesheet" th:href="@{/css/myteams.css}">
    <link rel="stylesheet" th:href="@{/css/basic/footer.css}">
    <link rel="stylesheet" th:href="@{/css/basic/sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/basic/header.css}">
    <link rel="stylesheet" th:href="@{/css/team/team-info.css}">
    <link rel="stylesheet" th:href="@{/css/basic/main-content-area.css}">
    <link rel="stylesheet" th:href="@{/css/team/team-members.css}">
</head>
<body>

<div class="layout">

    <div th:replace="~{layout/sidebar :: sidebar}"></div>

    <div class="main-wrap">

        <div th:replace="~{layout/header :: header('Team Members')}"></div>

        <main class="main-content">

            <div class="info-card-container members-page">

                <!-- ============================================== -->
                <!-- 초대 코드 -->
                <!-- team-info.html과 같은 team.myRole.isManager() 조건 재사용,
                     API는 myteams.js의 openInviteModal 로직과 동일 -->
                <!-- ============================================== -->
                <section class="members-card">
                    <div class="members-card-header">
                        <div>
                            <h2>Members</h2>
                            <p class="sub-text" th:text="${team.teamName}">Team Name</p>
                        </div>
                    </div>

                    <div class="invitation-management"
                         th:if="${team.myRole != null && team.myRole.isManager()}">
                        <div class="setting-row">
                            <div class="setting-row-text">
                                <strong>초대 코드</strong>
                                <p>새로운 8자리 초대 코드를 발급합니다. (활성 팀에서만 가능)</p>
                            </div>
                            <button type="button" class="btn-primary" id="createInviteCodeBtn">코드 생성</button>
                        </div>

                        <div class="code-squares" id="codeSquaresContainer" hidden>
                            <div class="code-square"></div>
                            <div class="code-square"></div>
                            <div class="code-square"></div>
                            <div class="code-square"></div>
                            <div class="code-square"></div>
                            <div class="code-square"></div>
                            <div class="code-square"></div>
                            <div class="code-square"></div>
                        </div>
                        <button type="button" class="btn-outline-sm" id="copyInviteCodeBtn" hidden>복사</button>

                        <div class="info-section-divider"></div>

                        <h3 class="panel-subtitle">초대 코드 발급 내역</h3>
                        <p class="invitation-code-policy">실제 초대 코드는 발급 직후에만 확인할 수 있습니다.</p>
                        <table class="members-table invitation-code-table">
                            <thead>
                            <tr>
                                <th>발급일</th>
                                <th>만료일</th>
                                <th>상태</th>
                                <th>관리</th>
                            </tr>
                            </thead>
                            <tbody id="invitationCodesTableBody">
                            <tr class="empty-row">
                                <td colspan="4">초대 코드 발급 내역을 불러오는 중입니다.</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="info-section-divider"></div>

                    <!-- ============================================== -->
                    <!-- 팀원 목록
                         실제 API: GET /api/front/teams/{teamId}/members (page/size/sort)
                         TeamMemberResponse = { teamMemberId, teamId, userId, teamRole }
                         ※ userId → 이름 변환 API가 아직 없어서 지금은 userId를 그대로 표시함.
                            나중에 이름 조회 API가 생기면 renderMembers()의 표시 부분만
                            바꾸면 됨 (fetchUserNames 같은 함수를 추가해서 매핑). -->
                    <!-- ============================================== -->
                    <h3 class="panel-subtitle">팀원 목록</h3>
                    <table class="members-table">
                        <thead>
                        <tr>
                            <th>User ID</th>
                            <th>역할</th>
                            <th>관리</th>
                        </tr>
                        </thead>
                        <tbody id="membersTableBody">
                        <tr class="empty-row">
                            <td colspan="3">팀원 목록을 불러오는 중입니다.</td>
                        </tr>
                        </tbody>
                    </table>

                    <nav class="building-pagination" id="membersPagination" hidden>
                        <a href="#" id="membersPrevBtn">Previous</a>
                        <span id="membersPageIndicator">1 / 1</span>
                        <a href="#" id="membersNextBtn">Next</a>
                    </nav>
                </section>

            </div>

        </main>
    </div>
</div>

<div th:replace="~{layout/footer :: footer}"></div>

<script th:inline="javascript">
    const teamId = /*[[${team.teamId}]]*/ null;
    const canManageTeam = /*[[${team.myRole != null && team.myRole.isManager()}]]*/ false;

    let currentPage = 0;
    const pageSize = 20;

    async function requestJson(url, options = {}) {
        const response = await fetch(url, {
            headers: { 'Content-Type': 'application/json', ...(options.headers || {}) },
            ...options
        });
        if (!response.ok) {
            const text = await response.text();
            throw new Error(text || `요청 실패 (${response.status})`);
        }
        if (response.status === 204) return null;
        return response.json();
    }

    // ============================================================
    // 팀원 목록 조회 및 렌더링
    // ============================================================
    async function loadMembers(page = 0) {
        const tbody = document.getElementById('membersTableBody');
        tbody.innerHTML = '<tr class="empty-row"><td colspan="3">팀원 목록을 불러오는 중입니다.</td></tr>';

        try {
            const result = await requestJson(
                `/api/front/teams/${teamId}/members?page=${page}&size=${pageSize}&sort=id,ASC`
            );
            currentPage = result.page;
            renderMembers(result.content || []);
            renderPagination(result);
        } catch (error) {
            tbody.innerHTML = `<tr class="empty-row"><td colspan="3">${error.message || '팀원 목록을 불러오지 못했습니다.'}</td></tr>`;
        }
    }

    function renderMembers(members) {
        const tbody = document.getElementById('membersTableBody');

        if (members.length === 0) {
            tbody.innerHTML = '<tr class="empty-row"><td colspan="3">팀원이 없습니다.</td></tr>';
            return;
        }

        tbody.innerHTML = members.map(member => `
            <tr>
                <td>User #${member.userId}</td>
                <td><span class="role-badge role-${member.teamRole.toLowerCase()}">${member.teamRole}</span></td>
                <td>
                    ${canManageTeam && member.teamRole !== 'OWNER'
            ? `<button type="button" class="btn-outline-sm remove-member-btn" data-member-id="${member.teamMemberId}">내보내기</button>`
            : '-'}
                </td>
            </tr>
        `).join('');

        // 내보내기 버튼에 이벤트 연결
        // TODO: 실제 "팀원 내보내기" API 경로 확인 필요 (CoreTeamRestController에 아직 없음)
        tbody.querySelectorAll('.remove-member-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                alert('팀원 내보내기 기능은 아직 준비 중입니다.');
            });
        });
    }

    function renderPagination(pageResult) {
        const pagination = document.getElementById('membersPagination');
        const indicator = document.getElementById('membersPageIndicator');
        const prevBtn = document.getElementById('membersPrevBtn');
        const nextBtn = document.getElementById('membersNextBtn');

        if (pageResult.totalPages <= 1) {
            pagination.hidden = true;
            return;
        }

        pagination.hidden = false;
        indicator.textContent = `${pageResult.page + 1} / ${pageResult.totalPages}`;

        prevBtn.classList.toggle('disabled', pageResult.first);
        nextBtn.classList.toggle('disabled', pageResult.last);

        prevBtn.onclick = (e) => {
            e.preventDefault();
            if (!pageResult.first) loadMembers(pageResult.page - 1);
        };
        nextBtn.onclick = (e) => {
            e.preventDefault();
            if (!pageResult.last) loadMembers(pageResult.page + 1);
        };
    }

    // ============================================================
    // 초대 코드 생성 - myteams.js의 openInviteModal 로직 재사용
    // ============================================================
    const createInviteCodeBtn = document.getElementById('createInviteCodeBtn');
    const codeSquares = document.querySelectorAll('#codeSquaresContainer .code-square');
    const codeSquaresContainer = document.getElementById('codeSquaresContainer');
    const copyInviteCodeBtn = document.getElementById('copyInviteCodeBtn');
    let currentInviteCode = '';

    const invitationCodeStatus = {
        AVAILABLE: { label: '사용 가능', className: 'available' },
        EXPIRED: { label: '만료됨', className: 'expired' },
        DEACTIVATED: { label: '비활성화됨', className: 'deactivated' }
    };

    async function loadInvitationCodes() {
        const tbody = document.getElementById('invitationCodesTableBody');
        if (!tbody) return;

        tbody.innerHTML = '<tr class="empty-row"><td colspan="4">초대 코드 발급 내역을 불러오는 중입니다.</td></tr>';

        try {
            const invitationCodes = await requestJson(`/api/front/teams/${teamId}/invitation-codes`);
            renderInvitationCodes(invitationCodes || []);
        } catch (error) {
            tbody.innerHTML = `<tr class="empty-row"><td colspan="4">${escapeHtml(error.message || '초대 코드 발급 내역을 불러오지 못했습니다.')}</td></tr>`;
        }
    }

    function renderInvitationCodes(invitationCodes) {
        const tbody = document.getElementById('invitationCodesTableBody');

        if (invitationCodes.length === 0) {
            tbody.innerHTML = '<tr class="empty-row"><td colspan="4">발급된 초대 코드가 없습니다.</td></tr>';
            return;
        }

        tbody.innerHTML = invitationCodes.map(invitationCode => {
            const status = invitationCodeStatus[invitationCode.status]
                || { label: invitationCode.status, className: 'unknown' };
            const action = invitationCode.status === 'AVAILABLE'
                ? `<button type="button" class="btn-outline-sm deactivate-invitation-code-btn" data-invitation-code-id="${invitationCode.invitationCodeId}">비활성화</button>`
                : '-';

            return `
                <tr>
                    <td>${formatDateTime(invitationCode.createdAt)}</td>
                    <td>${formatDateTime(invitationCode.expiresAt)}</td>
                    <td><span class="invitation-status-badge status-${status.className}">${escapeHtml(status.label)}</span></td>
                    <td>${action}</td>
                </tr>
            `;
        }).join('');

        tbody.querySelectorAll('.deactivate-invitation-code-btn').forEach(button => {
            button.addEventListener('click', () => deactivateInvitationCode(button));
        });
    }

    async function deactivateInvitationCode(button) {
        button.disabled = true;

        try {
            await requestJson(
                `/api/front/teams/${teamId}/invitation-codes/${button.dataset.invitationCodeId}`,
                { method: 'DELETE' }
            );
            await loadInvitationCodes();
        } catch (error) {
            button.disabled = false;
            alert(error.message || '초대 코드를 비활성화하지 못했습니다.');
        }
    }

    function formatDateTime(value) {
        if (!value) return '-';
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return escapeHtml(value);
        return new Intl.DateTimeFormat('ko-KR', {
            year: 'numeric', month: '2-digit', day: '2-digit',
            hour: '2-digit', minute: '2-digit'
        }).format(date);
    }

    function escapeHtml(value) {
        return String(value)
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#039;');
    }

    if (createInviteCodeBtn) {
        createInviteCodeBtn.addEventListener('click', async () => {
            createInviteCodeBtn.disabled = true;
            createInviteCodeBtn.textContent = '생성 중...';
            currentInviteCode = '';
            codeSquares.forEach(sq => sq.textContent = '');

            try {
                const data = await requestJson(`/api/front/teams/${teamId}/invitation-codes`, {
                    method: 'POST',
                    body: JSON.stringify({})
                });

                currentInviteCode = data.code || '';
                for (let i = 0; i < codeSquares.length; i += 1) {
                    codeSquares[i].textContent = currentInviteCode[i] || '';
                }

                codeSquaresContainer.hidden = false;
                copyInviteCodeBtn.hidden = false;
                await loadInvitationCodes();
            } catch (err) {
                alert(err.message || '초대 코드 발급에 실패했습니다.');
            } finally {
                createInviteCodeBtn.disabled = false;
                createInviteCodeBtn.textContent = '코드 생성';
            }
        });
    }

    if (copyInviteCodeBtn) {
        copyInviteCodeBtn.addEventListener('click', () => {
            if (!currentInviteCode) {
                alert('아직 코드가 발급되지 않았습니다.');
                return;
            }
            navigator.clipboard.writeText(currentInviteCode)
                .then(() => alert('초대 코드가 복사되었습니다!'))
                .catch(() => alert('복사에 실패했습니다.'));
        });
    }

    document.addEventListener('DOMContentLoaded', () => {
        loadMembers(0);
        if (canManageTeam) loadInvitationCodes();
    });
</script>

</body>
</html>
