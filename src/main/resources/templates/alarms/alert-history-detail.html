<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>알림 이력 상세</title>

  <!-- 공통 헤더/사이드바/푸터 CSS (header-sidebar.css는 .layout에 padding이 있어서 안 씀 -> 사이드바/헤더가 화면에 딱 붙어야 함) -->
  <link rel="stylesheet" th:href="@{/css/basic/footer.css}">
  <link rel="stylesheet" th:href="@{/css/basic/sidebar.css}">
  <link rel="stylesheet" th:href="@{/css/basic/header.css}">
  <link rel="stylesheet" th:href="@{/css/basic/layout.css}">
  <link rel="stylesheet" th:href="@{/css/alert-history-detail.css}">

    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="application-name" content="4iren">
</head>
<body>

<div class="layout">
  <!-- 좌측 사이드바 (공통) -->
  <div th:replace="~{layout/sidebar :: sidebar}"></div>

  <div class="main-wrap">
    <!-- 상단 헤더 (공통) -->
    <div th:replace="~{layout/header :: header('알림 이력 상세')}"></div>

    <!-- 본문 영역 -->
    <div class="main-content">

      <div class="maincontainer">
        <div class="detail-card-wrap">
          <div class="detail-card">
            <div class="detail-row">
              <span class="label">alertHistoryId</span>
              <span class="value" th:text="${alertHistory.alertHistoryId}">101</span>
            </div>
            <div class="detail-row">
              <span class="label">roomId</span>
              <span class="value" th:text="${alertHistory.roomId}">3층 스터디룸</span>
            </div>
            <div class="detail-row">
              <span class="label">botType</span>
              <span class="value" th:text="${alertHistory.botType}">TELEGRAM</span>
            </div>
            <div class="detail-row">
              <span class="label">alertType</span>
              <span class="value" th:text="${alertHistory.alertType}">CO2_HIGH</span>
            </div>
            <div class="detail-row message">
              <span class="label">message</span>
              <span class="value" th:text="${alertHistory.message}">CO2 농도가 임계값을 초과했습니다.</span>
            </div>
            <div class="detail-row">
              <span class="label">sendAt</span>
              <span class="value"
                    th:text="${#temporals.format(alertHistory.sendAt, 'yyyy-MM-dd HH:mm:ss')}">2026-08-12 09:14:03</span>
            </div>
          </div>

          <!--
            목록에서 걸어둔 필터/페이지가 풀리지 않게 하려면
            목록 페이지에서 넘어올 때 쿼리 파라미터를 그대로 들고 와서
            아래 링크에 다시 실어주는 방식이 필요 (백엔드와 라우팅 협의 필요)
            우선은 필터 없이 목록 첫 페이지로 돌아가는 링크로 작성
          -->
          <a class="btn-back" th:href="@{/alert-histories}">← 목록으로</a>
        </div>
      </div>
    </div>
    <!-- // 본문 내용 끝 -->
  </div>
</div>

<!-- 하단 푸터 (공통) -->
<div th:replace="~{layout/footer :: footer}"></div>

</body>
</html>
