<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>알림 이력 조회</title>

    <!--
   <div th:replace="~{/basic/header-sidebar :: layout(~{::section})}">
 -->

    <!-- .cssf 오타 수정 -->
    <link rel="stylesheet" href="/css/alert-history.css">
</head>
<body>

<section>
    <h1>알림 이력 조회</h1>

    <!-- ================= 필터 폼 ================= -->
    <form class="filter-box" method="get" th:action="@{/admin/alert-histories}">

        <div class="filter-field">
            <label for="roomId">room</label>
            <select id="roomId" name="roomId">
                <option value="">전체</option>
                <!-- filterOptions?.rooms 로 null 안전 처리 -->
                <option th:each="r : ${filterOptions?.rooms}"
                        th:value="${r.roomId}"
                        th:text="${r.roomName}"
                        th:selected="${selRoomId != null and selRoomId == r.roomId}">
                </option>
            </select>
        </div>

        <div class="filter-field">
            <label for="botType">botType</label>
            <select id="botType" name="botType">
                <option value="">전체</option>
                <!-- filterOptions?.botTypeList 로 null 안전 처리 -->
                <option th:each="b : ${filterOptions?.botTypeList}"
                        th:value="${b}"
                        th:text="${b}"
                        th:selected="${b == selBotType}">
                </option>
            </select>
        </div>

        <div class="filter-field">
            <label for="alertType">alertType</label>
            <select id="alertType" name="alertType">
                <option value="">전체</option>
                <!-- filterOptions?.alertTypeList 로 null 안전 처리 -->
                <option th:each="a : ${filterOptions?.alertTypeList}"
                        th:value="${a}"
                        th:text="${a}"
                        th:selected="${a == selAlertType}">
                </option>
            </select>
        </div>

        <div class="filter-field">
            <label for="from">from</label>
            <input type="date" id="from" name="from" th:value="${selFrom}">
        </div>

        <div class="filter-field">
            <label for="to">to</label>
            <input type="date" id="to" name="to" th:value="${selTo}">
        </div>

        <input type="hidden" name="size" th:value="${size}">
        <input type="hidden" name="sort" th:value="${sort}">

        <button type="submit" class="btn-search">검색</button>
    </form>

    <!-- ================= 결과 테이블 ================= -->
    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Room</th>
            <th>Bot Type</th>
            <th>Alert Type</th>
            <th>Message</th>
            <th>Send At</th>
        </tr>
        </thead>
        <tbody>
        <!-- alertHistories?.content 로 null 안전 처리 -->
        <tr th:if="${alertHistories == null or alertHistories.content == null or alertHistories.content.isEmpty()}" class="empty-row">
            <td colspan="6">조회된 알림 이력이 없습니다.</td>
        </tr>

        <tr th:each="item : ${alertHistories?.content}">
            <td>
                <a class="row-link"
                   th:href="@{/admin/alert-histories/{id}(id=${item.alertHistoryId})}"
                   th:text="${item.alertHistoryId}">1</a>
            </td>
            <td>
                <a class="row-link"
                   th:href="@{/admin/alert-histories/{id}(id=${item.alertHistoryId})}"
                   th:text="${item.roomId}">roomId</a>
            </td>
            <td th:text="${item.botType}">TELEGRAM</td>
            <td th:text="${item.alertType}">CO2_HIGH</td>
            <td th:text="${item.message}">메시지</td>
            <td th:text="${#temporals.format(item.sendAt, 'yyyy-MM-dd HH:mm')}">2026-08-12 09:14</td>
        </tr>
        </tbody>
    </table>

    <!-- ================= 페이지네이션 ================= -->
    <div class="pagination" th:if="${alertHistories != null and alertHistories.totalPages > 0}">

        <a th:if="${!alertHistories.first}"
           th:href="@{/admin/alert-histories(page=${alertHistories.page - 1}, size=${size}, sort=${sort},
                     roomId=${selRoomId}, botType=${selBotType}, alertType=${selAlertType}, from=${selFrom}, to=${selTo})}">
            ← 이전
        </a>
        <span th:if="${alertHistories.first}" class="disabled">〈</span>

        <th:block th:each="i : ${#numbers.sequence(0, alertHistories.totalPages - 1)}">
            <span th:if="${i == alertHistories.page}" class="current" th:text="${i + 1}">1</span>
            <a th:if="${i != alertHistories.page}"
               th:text="${i + 1}"
               th:href="@{/admin/alert-histories(page=${i}, size=${size}, sort=${sort},
                         roomId=${selRoomId}, botType=${selBotType}, alertType=${selAlertType}, from=${selFrom}, to=${selTo})}">
                2
            </a>
        </th:block>

        <a th:if="${!alertHistories.last}"
           th:href="@{/admin/alert-histories(page=${alertHistories.page + 1}, size=${size}, sort=${sort},
                     roomId=${selRoomId}, botType=${selBotType}, alertType=${selAlertType}, from=${selFrom}, to=${selTo})}">
            〉
        </a>
        <span th:if="${alertHistories.last}" class="disabled">다음 →</span>

    </div>

</section>

</body>
</html>
