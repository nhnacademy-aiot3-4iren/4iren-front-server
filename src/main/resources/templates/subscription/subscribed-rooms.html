<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>구독중인 강의실 - 4iren</title>
    <link rel="stylesheet" href="/fonts/font.css">
    <link rel="stylesheet" th:href="@{/css/basic/layout.css}">
    <link rel="stylesheet" th:href="@{/css/basic/footer.css}">
    <link rel="stylesheet" th:href="@{/css/basic/sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/basic/header.css}">
    <link rel="stylesheet" th:href="@{/css/basic/main-content-area.css}">
    <link rel="stylesheet" th:href="@{/css/myteams.css}">
    <link rel="stylesheet" th:href="@{/css/team/buildings.css}">
    <link rel="stylesheet" th:href="@{/css/subscription/subscribed-rooms.css}">
    <link rel="icon" href="/favicon.ico" sizes="any">
</head>
<body>
<div class="layout">
    <div th:replace="~{layout/sidebar :: sidebar}"></div>

    <div class="main-content-area">
        <div th:replace="~{layout/header :: header('구독중인 강의실')}"></div>

        <main class="content subscribed-room-page">
            <div class="building-page-header">
                <div>
                    <a class="back-link" th:href="@{/dashboard}">Dashboard</a>
                    <h2>Subscribed Classroom</h2>
                    <p>구독한 강의실을 선택하면 상세 화면으로 이동합니다.</p>
                </div>
                <div class="building-summary">
                    <span>Subscribed</span>
                    <strong th:text="${#lists.size(rooms)}">0</strong>
                </div>
            </div>

            <section class="building-list-panel subscribed-room-list" aria-label="구독중인 강의실 목록"
                     th:if="${!#lists.isEmpty(rooms)}">
                <a class="building-row subscribed-room-card"
                   th:each="room : ${rooms}"
                   th:href="@{/teams/{teamId}/buildings/{buildingId}/rooms/{roomId}(teamId=${room.teamId}, buildingId=${room.buildingId}, roomId=${room.roomId})}">
                    <div class="building-main">
                        <div class="building-icon room-icon">
                            <img src="/photo/icon/door-icon.png" alt="classroom">
                        </div>
                        <div>
                            <h3 th:text="${room.roomName}">E.Space</h3>
                            <address th:text="${room.buildingName}">IT융합대학</address>
                        </div>
                    </div>
                    <span class="building-detail-link">상세 보기</span>
                </a>
            </section>

            <section class="empty-state building-empty subscribed-room-empty" th:if="${#lists.isEmpty(rooms)}">
                <p>구독중인 강의실이 없습니다.</p>
            </section>
        </main>
    </div>
</div>

<div th:replace="~{layout/footer :: footer}"></div>
</body>
</html>
