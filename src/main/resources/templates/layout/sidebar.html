<aside xmlns:th="http://www.thymeleaf.org" th:fragment="sidebar" class="sidebar">

                currentTeamId도 추가하거나, 사용자가 팀을 하나만 갖고 있다는 전제로

                지금은 teamId 없이 /team-info로 접속하면 TeamController가 /team으로
                리다이렉트하게 되어있어 최소한 에러는 안 남.

    <script>
        (function () {
            var sidebar = document.currentScript
                ? document.currentScript.closest('.sidebar')
                : document.querySelector('.sidebar');
            if (!sidebar) return;

            var STORAGE_KEY = 'sidebar-collapsed';
            var toggleBtn = sidebar.querySelector('.side-toggle');
            var teamToggle = sidebar.querySelector('.nav-item-toggle[data-page="team"]');
            var submenu = sidebar.querySelector('#team-submenu');

            function readStore() {
                try { return window.localStorage.getItem(STORAGE_KEY); } catch (e) { return null; }
            }

            function writeStore(value) {
                try { window.localStorage.setItem(STORAGE_KEY, value); } catch (e) { /* 저장 불가 환경은 무시 */ }
            }

            // 1) 일반 메뉴 + 서브메뉴 active 처리
            var path = window.location.pathname;
            document.querySelectorAll('.sidebar-nav [href], .sidebar-bottom [href]').forEach(function (link) {
                if (link.getAttribute('href') === path) {
                    link.classList.add('active');
                }
            });

            // 2) 접힘 상태 복원 (첫 페인트에서 애니메이션이 튀지 않도록 no-transition 사용)
            if (readStore() === 'collapsed') {
                sidebar.classList.add('no-transition', 'is-collapsed');
                if (toggleBtn) toggleBtn.setAttribute('aria-expanded', 'false');
                window.requestAnimationFrame(function () {
                    window.requestAnimationFrame(function () {
                        sidebar.classList.remove('no-transition');
                    });
                });
            }

            function setCollapsed(collapsed) {
                sidebar.classList.toggle('is-collapsed', collapsed);
                if (toggleBtn) toggleBtn.setAttribute('aria-expanded', String(!collapsed));
                writeStore(collapsed ? 'collapsed' : 'expanded');
            }

            if (toggleBtn) {
                toggleBtn.addEventListener('click', function () {
                    setCollapsed(!sidebar.classList.contains('is-collapsed'));
                });
            }

            // 3) Team 하위 메뉴 토글 + 현재 페이지가 하위 메뉴면 자동으로 펼치기
            if (teamToggle && submenu) {
                function setSubmenuOpen(open) {
                    submenu.classList.toggle('open', open);
                    teamToggle.classList.toggle('expanded', open);
                    teamToggle.setAttribute('aria-expanded', String(open));
                }

                if (submenu.querySelector('.active')) {
                    setSubmenuOpen(true);
                }

                var toggleSubmenu = function () {
                    // 접힌 상태에서는 서브메뉴를 띄울 자리가 없으므로 사이드바를 먼저 펼침
                    if (sidebar.classList.contains('is-collapsed')) {
                        setCollapsed(false);
                        setSubmenuOpen(true);
                        return;
                    }
                    setSubmenuOpen(!submenu.classList.contains('open'));
                };

                teamToggle.addEventListener('click', toggleSubmenu);
                teamToggle.addEventListener('keydown', function (e) {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        toggleSubmenu();
                    }
                });
            }
        })();
    </script>
