<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>새 페이지 타이틀 - Re I New</title>

    <!-- 해당 페이지 전용 CSS가 있다면 여기에 연결하세요 -->
    <!-- <link rel="stylesheet" th:href="@{/css/페이지전용.css}"> -->

    <!-- 공통 헤더/사이드바/푸터 CSS -->
    <link rel="stylesheet" th:href="@{/css/basic/header-sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/basic/footer.css}">
    <!-- 모든 페이지 공통으로 불러오는 레이아웃 (헤더, 사이드바) -->
    <link rel="stylesheet" th:href="@{/css/basic/layout.css}">

    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="application-name" content="4iren">
</head>
<body>

<!-- 전체 레이아웃 래퍼 -->
<div class="layout">

    <!-- ============ 1. 좌측 사이드바 영역 ============ -->
    <div th:replace="~{basic/sidebar :: sidebar}"></div>

    <!-- ============ 2. 우측 전체(헤더 + 메인 컨텐츠) ============ -->
    <div class="main-wrap">

        <!-- ============ 상단 헤더 영역 ============ -->
        <div th:replace="~{basic/header :: header}"></div>

        <!-- ============ 본문 내용 (여기서부터 작업) ============ -->
        <div class="main-content">

            <!-- 페이지 제목 -->
            <h2>페이지 제목을 입력하세요</h2>

            <!-- 메인 컨텐츠 박스 (필요시 클래스명 변경 가능) -->
            <div class="maincontainer">

                <!-- ========================================== -->
                <!-- 여기에 새로운 페이지의 콘텐츠를 작성하시면 됩니다 -->
                <!-- ========================================== -->
                <p>여기에 새로운 내용을 입력하세요.</p>

            </div>

        </div>
        <!-- // 본문 내용 끝 -->

    </div>
</div>

<!-- ============ 하단 푸터 영역 ============ -->
<div th:replace="~{basic/footer :: footer}"></div>

<!-- 해당 페이지 전용 JS가 있다면 여기에 연결하세요 -->
<!-- <script src="/js/페이지전용.js"></script> -->
</body>
</html>
