<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>최고관리자 대시보드 - Re I New</title>

    <!-- 공통 헤더/사이드바/푸터 CSS -->
    <link rel="stylesheet" th:href="@{/css/layout.css}">
    <link rel="stylesheet" th:href="@{/css/basic/footer.css}">
    <link rel="stylesheet" th:href="@{/css/basic/sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/basic/header.css}">
    <link rel="stylesheet" th:href="@{/css/basic/main-content-area.css}">
    <link rel="stylesheet" th:href="@{/css/admin_list.css}">

    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="application-name" content="4iren">
</head>
<body>

<div class="layout">
    <!-- 좌측 사이드바 (공통) -->
    <div th:replace="~{basic/sidebar :: sidebar}"></div>

    <div class="main-wrap">
        <!-- 상단 헤더 (공통) -->
        <div th:replace="~{basic/header :: header('관리자 대시보드')}"></div>

        <!-- 본문 영역 -->
        <div class="main-content">
            <h2 style="margin-bottom: 20px; color: #2c3e50;">관리자 계정 대시보드</h2>

            <a th:href="@{/payment/billing}" style="display: inline-block; margin-bottom: 20px; color: #0d6efd; text-decoration: none; font-weight: 600;">결제 관리 →</a>

            <div class="admin-wrap">
                <!-- 알림 메시지 -->
                <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
                <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

                <!-- 관리자 생성 폼 -->
                <h3 style="margin-bottom: 15px; font-size: 18px; color: #34495e;">➕ 신규 관리자(Admin) 생성</h3>
                <div class="create-form">
                    <form th:action="@{/owner/admin/create}" th:object="${adminCreateRequest}" method="post">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="loginId">아이디</label>
                                <input type="text" id="loginId" th:field="*{loginId}" placeholder="아이디 입력 (최대 50자)" required>
                            </div>
                            <div class="form-group">
                                <label for="password">비밀번호</label>
                                <input type="password" id="password" th:field="*{password}" placeholder="비밀번호 입력 (최소 8자)" required>
                            </div>
                            <div class="form-group">
                                <label for="name">이름</label>
                                <input type="text" id="name" th:field="*{name}" placeholder="담당자 이름 입력" required>
                            </div>
                            <div class="form-group" style="flex: 0 0 auto;">
                                <button type="submit" class="btn btn-primary" style="height: 41px;">계정 생성</button>
                            </div>
                        </div>
                    </form>
                </div>

                <!-- 관리자 리스트 테이블 -->
                <h3 style="margin-bottom: 15px; font-size: 18px; color: #34495e;">관리자 목록</h3>
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>No</th>
                                <th>아이디</th>
                                <th>이름</th>
                                <th>상태</th>
                                <th>가입일시</th>
                                <th>관리 액션</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="admin : ${admins}">
                                <td th:text="${admin.userId}">1</td>
                                <td>
                                    <a th:href="@{/owner/admin/{id}(id=${admin.userId})}" th:text="${admin.loginId}" style="font-weight: 600; color: #0d6efd; text-decoration: none;">admin_id</a>
                                </td>
                                <td th:text="${admin.name}">홍길동</td>
                                <td>
                                    <span th:if="${admin.status == 'ACTIVE'}" class="status-badge status-active">활성</span>
                                    <span th:if="${admin.status == 'WITHDRAWN'}" class="status-badge status-withdrawn">삭제됨</span>
                                </td>
                                <td th:text="${#temporals.format(admin.createdAt, 'yyyy-MM-dd HH:mm')}">2026-08-24</td>
                                <td>
                                    <div class="action-cell">
                                        <a th:href="@{/owner/admin/{id}(id=${admin.userId})}" class="btn" style="background-color: #6c757d;">상세보기</a>
                                        <!-- 활성 상태 -->
                                        <th:block th:if="${admin.status == 'ACTIVE'}">
                                            <form th:action="@{/owner/admin/{id}/delete(id=${admin.userId})}" method="post" onsubmit="return confirm('이 관리자 계정을 비활성화 하시겠습니까?');">
                                                <button type="submit" class="btn btn-danger">삭제</button>
                                            </form>
                                            <form th:action="@{/owner/admin/{id}/reset-password(id=${admin.userId})}" method="post" onsubmit="return confirm('비밀번호를 초기화(1234) 하시겠습니까?');">
                                                <button type="submit" class="btn btn-warning">초기화</button>
                                            </form>
                                        </th:block>
                                        
                                        <!-- 비활성 상태 -->
                                        <th:block th:if="${admin.status == 'WITHDRAWN'}">
                                            <form th:action="@{/owner/admin/{id}/restore(id=${admin.userId})}" method="post" onsubmit="return confirm('이 계정을 다시 활성화하시겠습니까?');">
                                                <button type="submit" class="btn btn-success">복구</button>
                                            </form>
                                        </th:block>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(admins)}">
                                <td colspan="6" style="padding: 40px; color: #6c757d;">등록된 관리자 계정이 없습니다.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

            </div>
        </div>
        <!-- // 본문 내용 끝 -->
    </div>
</div>

<!-- 하단 푸터 (공통) -->
<div th:replace="~{basic/footer :: footer}"></div>

</body>
</html>
