<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 상세 정보 - Re I New</title>

    <!-- 공통 헤더/사이드바/푸터 CSS -->
    <link rel="stylesheet" th:href="@{/css/header-sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/footer.css}">
    <link rel="stylesheet" th:href="@{/css/layout.css}">
    
    <link rel="stylesheet" th:href="@{/css/admin_detail.css}">

</head>
<body>

<div class="layout">
    <!-- 좌측 사이드바 (공통) -->
    <div th:replace="~{/basic/sidebar :: sidebar}"></div>

    <div class="main-wrap">
        <!-- 상단 헤더 (공통) -->
        <div th:replace="~{/basic/header :: header}"></div>

        <!-- 본문 영역 -->
        <div class="main-content">
            <h2 style="margin-bottom: 20px; text-align: center; color: #2c3e50;">🧑‍💻 관리자 상세 정보</h2>

            <div class="detail-wrap">
                <div class="info-group">
                    <div class="info-label">고유 번호 (User ID)</div>
                    <div class="info-value" th:text="${admin.userId}">1</div>
                </div>
                <div class="info-group">
                    <div class="info-label">로그인 아이디</div>
                    <div class="info-value" th:text="${admin.loginId}">admin123</div>
                </div>
                <div class="info-group">
                    <div class="info-label">이름</div>
                    <div class="info-value" th:text="${admin.name}">홍길동</div>
                </div>
                <div class="info-group">
                    <div class="info-label">이메일</div>
                    <div class="info-value" th:text="${admin.email}">등록안됨</div>
                </div>
                <div class="info-group">
                    <div class="info-label">계정 상태</div>
                    <div class="info-value">
                        <span th:if="${admin.status == 'ACTIVE'}" style="color: #198754; font-weight: bold;">✅ 활성 (ACTIVE)</span>
                        <span th:if="${admin.status == 'WITHDRAWN'}" style="color: #dc3545; font-weight: bold;">🚫 비활성 (삭제됨)</span>
                    </div>
                </div>
                <div class="info-group">
                    <div class="info-label">생성 일시</div>
                    <div class="info-value" th:text="${#temporals.format(admin.createdAt, 'yyyy년 MM월 dd일 HH시 mm분')}">2026-08-24</div>
                </div>

                <!-- 하단 액션 버튼 -->
                <div class="action-buttons">
                    <a th:href="@{/owner/admin/list}" class="btn btn-secondary">목록으로 돌아가기</a>
                    
                    <!-- 상태에 따른 액션 폼 -->
                    <th:block th:if="${admin.status == 'ACTIVE'}">
                        <form th:action="@{/owner/admin/{id}/reset-password(id=${admin.userId})}" method="post" onsubmit="return confirm('비밀번호를 초기화(12345678) 하시겠습니까?');">
                            <button type="submit" class="btn btn-warning">비밀번호 초기화</button>
                        </form>
                        <form th:action="@{/owner/admin/{id}/delete(id=${admin.userId})}" method="post" onsubmit="return confirm('이 관리자 계정을 비활성화 하시겠습니까?');">
                            <button type="submit" class="btn btn-danger">계정 삭제</button>
                        </form>
                    </th:block>

                    <th:block th:if="${admin.status == 'WITHDRAWN'}">
                        <form th:action="@{/owner/admin/{id}/restore(id=${admin.userId})}" method="post" onsubmit="return confirm('이 계정을 다시 활성화하시겠습니까?');">
                            <button type="submit" class="btn btn-success">계정 복구</button>
                        </form>
                    </th:block>
                </div>
            </div>

        </div>
        <!-- // 본문 내용 끝 -->
    </div>
</div>

<!-- 하단 푸터 (공통) -->
<div th:replace="~{/basic/footer :: footer}"></div>

</body>
</html>
