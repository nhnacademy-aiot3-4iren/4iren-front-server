<div th:fragment="circle-timer(botType)">
  <div th:id="'circleTimer-' + ${botType}" class="base-timer">
    <svg class="base-timer__svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <g class="base-timer__circle">
        <circle class="base-timer__path-elapsed" cx="50" cy="50" r="45"></circle>
        <path th:id="'timer-path-' + ${botType}" stroke-dasharray="283" class="base-timer__path-remaining green"
              d="M 50, 50 m -45, 0 a 45,45 0 1,0 90,0 a 45,45 0 1,0 -90,0"></path>
      </g>
    </svg>
    <span th:id="'timerText-' + ${botType}" class="base-timer__label">00:00</span>
  </div>
</div>
