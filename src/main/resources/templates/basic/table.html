<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>알림 목록</title>
    <!-- Tailwind CSS를 읽어오기 위한 필수 스크립트 (별도 css 파일 필요 없음!) -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">

<div class="max-w-lg mx-auto bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden">

    <!-- 상단 헤더 -->
    <div class="flex justify-end px-5 py-3 border-b border-gray-100">
        <button class="flex items-center gap-1 text-xs text-gray-500 bg-gray-50 px-3 py-1.5 rounded-full hover:bg-gray-100">
            Sort by : <strong class="text-gray-800">Newest</strong>
            <span class="text-[10px] text-gray-400">▼</span>
        </button>
    </div>

    <!-- 알림 리스트 -->
    <ul class="divide-y divide-gray-100">

        <!-- 1. 미확인 알림 (ADMIN) - 주황색 배경 적용 -->
        <li class="bg-orange-50/60 hover:bg-orange-50 transition-colors">
            <a href="#" class="flex justify-between items-center px-5 py-3.5">
                <div class="space-y-1">
                    <div class="flex items-center gap-1.5">
                        <span class="text-sm font-bold text-gray-900">센서에 이상이 발생하였습니다</span>
                        <span class="w-2 h-2 rounded-full bg-blue-600 inline-block"></span>
                    </div>
                    <p class="text-xs text-gray-500">어디 센서, 어떤 임계치를 얼만큼이나 초과했는지,~</p>
                </div>
                <div class="flex flex-col items-end gap-1 shrink-0 ml-4">
                    <span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-blue-100 text-blue-600">ADMIN</span>
                    <span class="text-[11px] text-gray-400">2 min ago</span>
                </div>
            </a>
        </li>

        <!-- 2. 미확인 알림 (MEMBER) - 주황색 배경 적용 -->
        <li class="bg-orange-50/60 hover:bg-orange-50 transition-colors">
            <a href="#" class="flex justify-between items-center px-5 py-3.5">
                <div class="space-y-1">
                    <div class="flex items-center gap-1.5">
                        <span class="text-sm font-bold text-gray-900">구독한 강의실 1에서의 알림</span>
                        <span class="w-2 h-2 rounded-full bg-orange-500 inline-block"></span>
                    </div>
                    <p class="text-xs text-gray-500">어디 센서, 어떤 임계치를 얼만큼이나 초과했는지,~</p>
                </div>
                <div class="flex flex-col items-end gap-1 shrink-0 ml-4">
                    <span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-orange-100 text-orange-500">MEMBER</span>
                    <span class="text-[11px] text-gray-400">2 min ago</span>
                </div>
            </a>
        </li>

        <!-- 3. 확인한 일반 알림 -->
        <li class="bg-white hover:bg-gray-50 transition-colors">
            <a href="#" class="flex justify-between items-center px-5 py-3.5">
                <div class="space-y-1">
                    <span class="text-sm font-bold text-gray-900">구독한 강의실 1에서의 알림</span>
                    <p class="text-xs text-gray-500">어디 센서, 어떤 임계치를 얼만큼이나 초과했는지,~</p>
                </div>
            </a>
        </li>

        <!-- 빈 칸 레이아웃 유지용 -->
        <li class="h-12 bg-white"></li>
        <li class="h-12 bg-white"></li>
    </ul>
</div>

</body>
</html>
