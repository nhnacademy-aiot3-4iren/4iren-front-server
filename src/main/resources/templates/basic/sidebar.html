<!-- ================================================================
     !! sidebar.html
     - 사용법: <div th:replace="~{sidebar :: sidebar}"></div>
     - 현재 페이지에 맞는 nav-item에 서버/JS에서 class="nav-item active" 부여
     ================================================================ -->
<aside xmlns:th="http://www.thymeleaf.org" th:fragment="sidebar" class="sidebar">
    <div class="sidebar-logo">
        <a th:href="@{/}">
            <img src="/photo/logo.png" alt="Logo">
        </a>
    </div>

    <nav class="sidebar-nav">
        <a href="/team" class="nav-item active" data-page="team">
            <img src="/photo/icon/team-icon.png" alt="team">
            <span>Team</span>
        </a>
        <a href="#" class="nav-item" data-page="classroom">
            <img src="/photo/icon/classroom-icon.png" alt="classroom">
            <span>Classroom</span>
        </a>
        <a href="#" class="nav-item" data-page="subscribe">
            <img src="/photo/icon/subscribe-icon.png" alt="subscribe">
            <span>Subscribe</span>
        </a>
        <a href="#" class="nav-item" data-page="settings">
            <img src="/photo/icon/setting-icon.png" alt="setting">
            <span>Settings</span>
        </a>
    </nav>
</aside>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        // 사이드바의 모든 메뉴 아이템을 가져옴
        const navItems = document.querySelectorAll('.sidebar-nav .nav-item');

        // 각 메뉴 아이템에 클릭 이벤트를 달아줍
        navItems.forEach(function(item) {
            item.addEventListener('click', function(e) {

                // (선택) 만약 href="#" 인 상태에서 페이지가 위로 튕기는 걸 막고 싶다면 아래 주석 풀기
                // e.preventDefault();

                // 먼저 모든 메뉴에서 'active' 클래스를 지움
                navItems.forEach(function(nav) {
                    nav.classList.remove('active');
                });

                // 방금 클릭한 메뉴에만 'active' 클래스를 추가
                this.classList.add('active');
            });
        });
    });
</script>
