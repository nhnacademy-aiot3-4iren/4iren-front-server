<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<body>
<!--
    Chat AI 플로팅 위젯

    사용법
    1) 쓰는 페이지의 <head> 에 CSS 추가
       <link rel="stylesheet" th:href="@{/css/LLM.css}">

    2) </body> 직전에 fragment 삽입
       <div th:replace="~{llm :: chatWidget}"></div>

    별도의 버튼을 만들 필요가 없습니다. 오른쪽 아래에 버튼이 함께 붙습니다.
-->
<div th:fragment="chatWidget" class="cw-root">

    <!-- 오른쪽 아래 고정 버튼 -->
    <button type="button" class="cw-launcher" id="cwLauncher"
            aria-label="Chat AI 열기" aria-expanded="false">
        <span class="cw-launcher-icon cw-icon-chat" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                 stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
            </svg>
        </span>
        <span class="cw-launcher-icon cw-icon-close" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 6L6 18"/><path d="M6 6l12 12"/>
            </svg>
        </span>
    </button>

    <!-- 채팅 패널 -->
    <div class="cw-panel" id="cwPanel" role="dialog" aria-modal="false"
         aria-labelledby="cwPanelTitle" hidden>

        <!-- 헤더 -->
        <div class="cw-header">
            <div class="cw-header-left">
                <div class="cw-avatar" aria-hidden="true">✦</div>
                <div class="cw-title-col">
                    <span class="cw-title" id="cwPanelTitle">Our AI</span>
                    <span class="cw-status"><span class="cw-dot"></span>온라인</span>
                </div>
            </div>
            <button type="button" class="cw-close" id="cwClose" aria-label="닫기">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 6L6 18"/><path d="M6 6l12 12"/>
                </svg>
            </button>
        </div>

        <!-- 대화 영역 -->
        <div class="cw-body" id="cwBody">
            <div class="cw-intro" id="cwIntro">
                <span class="cw-intro-spark" aria-hidden="true">✦</span>
                <div class="cw-intro-title">궁금한 점을 물어보세요</div>
                <div class="cw-intro-desc">
                    공간 상태, 공기질, 날씨에 대해<br>무엇이든 편하게 물어보세요.
                </div>
                <div class="cw-chips">
                    <button type="button" class="cw-chip" data-q="오늘 날씨 어때?">오늘 날씨 어때?</button>
                    <button type="button" class="cw-chip" data-q="공기질은 괜찮아?">공기질은 괜찮아?</button>
                    <button type="button" class="cw-chip" data-q="오늘 우산 챙겨야 할까?">오늘 우산 챙겨야 할까?</button>
                </div>
            </div>
            <!-- 메시지가 여기에 쌓임 -->
        </div>

        <!-- 입력 영역 -->
        <div class="cw-composer">
            <div class="cw-composer-bar">
                <label for="cwInput" class="cw-sr-only">질문 입력</label>
                <input type="text" id="cwInput" class="cw-input"
                       placeholder="AI에게 질문해 주세요." autocomplete="off">
                <button type="button" class="cw-send" id="cwSend" disabled aria-label="보내기">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 19V5"/><path d="M5 12l7-7 7 7"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        (function () {
            const root     = document.querySelector('.cw-root');
            const launcher = document.getElementById('cwLauncher');
            const panel    = document.getElementById('cwPanel');
            const closeBtn = document.getElementById('cwClose');
            const body     = document.getElementById('cwBody');
            const input    = document.getElementById('cwInput');
            const sendBtn  = document.getElementById('cwSend');

            let sending = false;
            let opened  = false;

            /* ================================================================
               열기 / 닫기
               ================================================================ */

            function open() {
                panel.hidden = false;
                // hidden 을 푼 직후 클래스를 붙여야 트랜지션이 동작한다
                requestAnimationFrame(() => {
                    root.classList.add('is-open');
                    launcher.setAttribute('aria-expanded', 'true');
                    launcher.setAttribute('aria-label', 'Chat AI 닫기');
                    setTimeout(() => input.focus(), 240);
                });
                opened = true;
            }

            function close() {
                root.classList.remove('is-open');
                launcher.setAttribute('aria-expanded', 'false');
                launcher.setAttribute('aria-label', 'Chat AI 열기');
                // 애니메이션이 끝난 뒤에 감춘다
                setTimeout(() => { panel.hidden = true; }, 240);
                opened = false;
            }

            launcher.addEventListener('click', () => {
                if (opened) close(); else open();
            });

            closeBtn.addEventListener('click', close);

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && opened) close();
            });

            /* ================================================================
               메시지
               ================================================================ */

            function updateSendState() {
                const active = input.value.trim().length > 0 && !sending;
                sendBtn.disabled = !active;
                sendBtn.classList.toggle('is-active', active);
            }

            function scrollToBottom() {
                body.scrollTop = body.scrollHeight;
            }

            function addMessage(text, isAi) {
                const row = document.createElement('div');
                row.className = 'cw-row' + (isAi ? '' : ' is-user');

                if (isAi) {
                    const avatar = document.createElement('div');
                    avatar.className = 'cw-msg-avatar';
                    avatar.textContent = '✦';
                    row.appendChild(avatar);
                }

                const bubble = document.createElement('div');
                bubble.className = 'cw-bubble ' + (isAi ? 'is-ai' : 'is-user');
                // 서버가 \n 을 문자열로 보내는 경우가 있어 실제 줄바꿈으로 바꿔준다
                bubble.textContent = String(text).replace(/\\n/g, '\n');
                row.appendChild(bubble);

                body.appendChild(row);
                scrollToBottom();
            }

            function showLoader() {
                const row = document.createElement('div');
                row.className = 'cw-row';
                row.id = 'cwLoaderRow';

                const avatar = document.createElement('div');
                avatar.className = 'cw-msg-avatar';
                avatar.textContent = '✦';
                row.appendChild(avatar);

                const bubble = document.createElement('div');
                bubble.className = 'cw-loader';
                for (let i = 0; i < 3; i++) {
                    const dot = document.createElement('span');
                    dot.className = 'cw-loader-dot';
                    bubble.appendChild(dot);
                }
                row.appendChild(bubble);

                body.appendChild(row);
                scrollToBottom();
            }

            function hideLoader() {
                const row = document.getElementById('cwLoaderRow');
                if (row) row.remove();
            }

            async function send(text) {
                const message = String(text || '').trim();
                if (!message || sending) return;

                // 첫 질문이면 안내 영역을 치운다
                const intro = document.getElementById('cwIntro');
                if (intro) intro.remove();

                addMessage(message, false);
                input.value = '';
                sending = true;
                updateSendState();
                input.disabled = true;
                showLoader();

                try {
                    const res = await fetch('/llm/answer', {
                        method: 'POST',
                        credentials: 'same-origin',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: new URLSearchParams({ message: message })
                    });
                    if (!res.ok) throw new Error('network');

                    const data = await res.json();
                    hideLoader();
                    addMessage(data.answer || '답변을 받지 못했습니다.', true);
                } catch (err) {
                    hideLoader();
                    addMessage('서버와 연결할 수 없습니다. 잠시 후 다시 시도해 주세요.', true);
                } finally {
                    sending = false;
                    input.disabled = false;
                    updateSendState();
                    input.focus();
                }
            }

            input.addEventListener('input', updateSendState);
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    send(input.value);
                }
            });
            sendBtn.addEventListener('click', () => send(input.value));

            panel.querySelectorAll('.cw-chip').forEach(chip => {
                chip.addEventListener('click', () => send(chip.dataset.q));
            });
        })();
    </script>
</div>
</body>
</html>
