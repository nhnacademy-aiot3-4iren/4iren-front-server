<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classroom - Flow Node Placement</title>

    <link rel="stylesheet" href="/css/flow-diy.css">
    <link rel="stylesheet" th:href="@{/css/footer.css}">
</head>
<body>

<div class="layout">

    <!-- ============ 사이드바 ============ -->
    <aside class="sidebar">

        <!--왼쪽 위 로고-->
        <div class="logo">
            <img src="/photo/logo.png" alt="Re I New Logo">
        </div>

        <!-- ===== Node 토글 ===== -->
        <div class="toggle-btn" id="node-toggle" data-target="node-group">
            <img src="/photo/icon/toggle-icon.png" alt="" class="toggle-icon">
            <img src="/photo/icon/node-icon.png" alt="" class="node-icon">
            <span>Node</span>
        </div>

        <div class="node-group" id="node-group">

            <div class="group-label start">
                <span class="dot"></span> 시작 노드
            </div>
            <div class="node-item" data-category="start" data-type="start" data-label="시작">
                <span class="type-dot"></span> 시작
            </div>

            <div class="group-label condition">
                <span class="dot"></span> 조건 노드
            </div>
            <div class="node-item" data-category="condition" data-type="threshold" data-label="임계치 판단">
                <span class="type-dot"></span> 임계치
            </div>
            <div class="node-item" data-category="condition" data-type="average" data-label="평균값 판단">
                <span class="type-dot"></span> 평균값
            </div>
            <div class="node-item" data-category="condition" data-type="duration" data-label="지속시간 판단">
                <span class="type-dot"></span> 지속시간
            </div>
            <div class="node-item" data-category="condition" data-type="gradient" data-label="기울기 판단">
                <span class="type-dot"></span> 기울기
            </div>

            <div class="group-label logical">
                <span class="dot"></span> 논리 노드
            </div>
            <div class="node-item" data-category="logical" data-type="or" data-label="OR 조건">
                <span class="type-dot"></span> OR
            </div>

            <div class="group-label action">
                <span class="dot"></span> 행동 노드
            </div>
            <div class="node-item" data-category="action" data-type="alert" data-label="알람(텔레그램)">
                <span class="type-dot"></span> 알림(Telegram)
            </div>
        </div>

        <!--메뉴별 절개선-->
        <div class="divider"></div>

        <!-- ===== Connection 토글 ===== -->
        <div class="toggle-btn" id="connection-toggle" data-target="connection-group">
            <img src="/photo/icon/toggle-icon.png" alt="" class="toggle-icon">
            <img src="/photo/icon/connection-icon.png" alt="" class="connection-icon">
            <span>Connection</span>
        </div>

        <div class="connection-group" id="connection-group">
            <div class="conn-item connection-item" data-type="true">
                <span class="conn-dot true"></span> true
            </div>
            <div class="conn-item connection-item" data-type="false">
                <span class="conn-dot false"></span> false
            </div>
            <div class="conn-item connection-item" data-type="null">
                <span class="conn-dot null"></span> null
            </div>
        </div>

        <!--메뉴별 절개선-->
        <div class="divider"></div>

        <!--설정 메뉴-->
        <div class="node-item static">
            <img src="/photo/icon/setting-icon.png" alt="설정" class="setting-i">
            <span>Settings</span>
        </div>

        <div class="save-box">
            <button class="save-btn">저장</button>
        </div>

    </aside>

    <!-- ============ 헤더  ============ -->
    <div class="main">
        <header class="header">
            <div class="page-title">Flow</div>

            <div class="search">
                <img src="/photo/icon/search-icon.png" alt="search" class="search-icon">
                <span class="search-placeholder">Search here...</span>
            </div>

            <div class="header-right">
                <div class="bell">
                    <img src="/photo/icon/alaram-icon.png" alt="알림">
                </div>

                <div class="user-box">
                    <span class="user-name">Jae na</span>
                    <span class="user-role">User</span>
                </div>
                <img src="/photo/icon/toggle-icon.png" alt="" class="user-toggle">
            </div>
        </header>

        <!-- 배치 모드일 때 상단에 뜨는 안내 바 -->
        <div class="placement-banner" id="placement-banner" style="display:none;">
            <span id="placement-banner-text">배치할 노드 종류를 선택하세요</span>
            <button id="placement-cancel" class="placement-cancel" style="display:none;">취소 (ESC)</button>
        </div>

        <div class="canvas-area" id="canvas-area">
            <div class="canvas-hint" id="canvas-hint">
                아직 배치된 노드가 없어요<br>
                왼쪽에서 노드 타입을 <b>선택</b>한 후, 이 영역을 <b>클릭</b>해서 배치하세요
            </div>

            <svg id="connection-svg">
                <defs>
                    <!-- true (초록 화살표) -->
                    <marker id="arrow-true"  markerWidth="6" markerHeight="6" refX="5" refY="2.5" orient="auto" markerUnits="strokeWidth">
                        <path d="M0.5,0.5 L4.5,2.5 L0.5,4.5" fill="#33C09C" />
                    </marker>
                    <!-- false (주황 화살표) -->
                    <marker id="arrow-false"  markerWidth="6" markerHeight="6" refX="5" refY="2.5" orient="auto" markerUnits="strokeWidth">
                        <path d="M0.5,0.5 L4.5,2.5 L0.5,4.5" fill="#EA5C2A" />
                    </marker>
                    <!-- null (노랑 화살표) -->
                    <marker id="arrow-null"  markerWidth="6" markerHeight="6" refX="5" refY="2.5" orient="auto" markerUnits="strokeWidth">
                        <path d="M0.5,0.5 L4.5,2.5 L0.5,4.5" fill="#E7C21F" />
                    </marker>
                </defs>
            </svg>
        </div>
    </div>

</div>

<!-- 배치 중 마우스를 따라다니는 노드 -->
<div class="ghost-node" id="ghost-node"></div>

<!-- 노드 타입별 설정 모달 -->
<div class="node-config-modal" id="node-config-modal" aria-hidden="true">
    <div class="node-config-dialog" role="dialog" aria-modal="true" aria-labelledby="node-config-title">
        <div class="node-config-header">
            <div>
                <p class="node-config-kicker" id="node-config-type">Node</p>
                <h2 id="node-config-title">노드 설정</h2>
            </div>
            <button type="button" class="node-config-close" id="node-config-close" aria-label="닫기">×</button>
        </div>

        <div class="node-config-status" id="node-config-status"></div>

        <form id="node-config-form" class="node-config-form">
            <div class="form-row">
                <label for="node-name-input">노드 이름</label>
                <input type="text" id="node-name-input" name="nodeName" required>
            </div>

            <div class="form-grid" id="node-config-fields"></div>

            <div class="node-config-actions">
                <button type="button" class="node-config-secondary" id="node-config-cancel">취소</button>
                <button type="button" class="node-config-secondary" id="node-config-validate">검증</button>
                <button type="submit" class="node-config-primary">적용</button>
            </div>
        </form>
    </div>
</div>

<div th:replace="~{/basic/footer :: footer}"></div>

<script src="/js/flow-diy.js"></script>
</body>
</html>
