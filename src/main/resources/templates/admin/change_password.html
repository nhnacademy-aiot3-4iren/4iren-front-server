<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>초기 비밀번호 변경 - 4iren</title>

    <link rel="stylesheet" href="/fonts/font.css">
    <link rel="stylesheet" th:href="@{/css/basic/sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/basic/header.css}">
    <link rel="stylesheet" th:href="@{/css/basic/main-content-area.css}">
    <link rel="stylesheet" th:href="@{/css/basic/footer.css}">
    <link rel="stylesheet" th:href="@{/css/account/change_password.css}">
    ...
</head>
<body>

<div class="layout">
    <div th:replace="~{layout/sidebar :: sidebar}"></div>

    <div class="main-content-area">
        <div th:replace="~{layout/header :: header('비밀번호 변경')}"></div>

        <div class="content">
            <h2 style="text-align: center; color: #2c3e50;">🔒 새 비밀번호 설정</h2>

            <div class="form-wrap">
                <div class="alert alert-info">
                    <strong>환영합니다!</strong> 보안을 위해 발급된 임시 비밀번호를 새 비밀번호로 변경해 주세요.
                </div>
                
                <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

                <form th:action="@{/admin/change-password}" method="post">
                    <div class="form-group">
                        <label for="password">새 비밀번호</label>
                        <input type="password" id="password" name="password" placeholder="새 비밀번호 입력 (8자 이상)" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="confirmPassword">새 비밀번호 확인</label>
                        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="비밀번호 재입력" required>
                    </div>
                    
                    <button type="submit" class="btn btn-primary">비밀번호 변경 완료</button>
                </form>
            </div>
        </div>
        <!-- // 본문 내용 끝 -->
    </div>
</div>

<!-- 하단 푸터 (공통) -->
<div th:replace="~{layout/footer :: footer}"></div>

</body>
</html>
