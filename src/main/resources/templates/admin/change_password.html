<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>초기 비밀번호 변경 - 4iren</title>

    <link rel="stylesheet" href="/fonts/font.css">
    <link rel="stylesheet" th:href="@{/css/basic/sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/basic/header.css}">
    <link rel="stylesheet" th:href="@{/css/basic/main-content-area.css}">
    <link rel="stylesheet" th:href="@{/css/basic/footer.css}">
    <link rel="stylesheet" th:href="@{/css/account/change_password.css}">

    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="application-name" content="4iren">
</head>
<body>

<div class="layout">
    <div th:replace="~{layout/sidebar :: sidebar}"></div>

    <div class="main-content-area">
        <div th:replace="~{layout/header :: header('비밀번호 변경')}"></div>

        <div class="content">

            <div class="pw-page">

                <!-- 카드 -->
                <section class="pw-card">

                    <div class="pw-card-head">
                        <span class="pw-icon" aria-hidden="true">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none"
                                 xmlns="http://www.w3.org/2000/svg">
                                <rect x="4.75" y="10.75" width="14.5" height="9.5" rx="2.25"
                                      stroke="currentColor" stroke-width="1.5"/>
                                <path d="M8 10.5V7.5C8 5.29086 9.79086 3.5 12 3.5C14.2091 3.5 16 5.29086 16 7.5V10.5"
                                      stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                                <circle cx="12" cy="15.5" r="1.25" fill="currentColor"/>
                            </svg>
                        </span>
                        <h2>새 비밀번호 설정</h2>
                        <p>보안을 위해 발급된 임시 비밀번호를 새 비밀번호로 변경해 주세요.</p>
                    </div>

                    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

                    <form th:action="@{/admin/change-password}" method="post">

                        <div class="form-group">
                            <label for="password">새 비밀번호</label>
                            <input type="password" id="password" name="password"
                                   placeholder="새 비밀번호 입력 (8자 이상)"
                                   autocomplete="new-password" required>
                        </div>

                        <div class="form-group">
                            <label for="confirmPassword">새 비밀번호 확인</label>
                            <input type="password" id="confirmPassword" name="confirmPassword"
                                   placeholder="비밀번호 재입력"
                                   autocomplete="new-password" required>
                        </div>

                        <p class="pw-hint">8자 이상, 영문과 숫자를 함께 사용하는 것을 권장합니다.</p>

                        <button type="submit" class="btn btn-primary">비밀번호 변경 완료</button>
                    </form>

                </section>

            </div>

        </div>
        <!-- // 본문 내용 끝 -->
    </div>
</div>

<!-- 하단 푸터 (공통) -->
<div th:replace="~{layout/footer :: footer}"></div>

</body>
</html>
