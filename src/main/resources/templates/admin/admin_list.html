<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>최고관리자 대시보드 - 4iren</title>

    <!-- 공통 헤더/사이드바/푸터 CSS -->
    <link rel="stylesheet" href="/fonts/font.css">
    <link rel="stylesheet" th:href="@{/css/basic/footer.css}">
    <link rel="stylesheet" th:href="@{/css/basic/sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/basic/header.css}">
    <link rel="stylesheet" th:href="@{/css/basic/main-content-area.css}">
    <link rel="stylesheet" th:href="@{/css/admin/admin_list.css}">

    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="application-name" content="4iren">
</head>
<body>

<div class="layout">
    <!-- 좌측 사이드바 (공통) -->
    <div th:replace="~{layout/sidebar :: sidebar}"></div>

    <div class="main-content-area">
        <!-- 상단 헤더 (공통) -->
        <div th:replace="~{layout/header :: header('관리자 대시보드')}"></div>

        <!-- 본문 영역 -->
        <div class="content">

            <div class="admin-page">

                <!-- 페이지 헤더 -->
                <div class="admin-page-header">
                    <h2>관리자 계정</h2>
                    <span class="admin-count-chip"
                          th:text="|총 ${#lists.size(admins)}명|">총 0명</span>
                </div>

                <!-- 알림 메시지 -->
                <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
                <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

                <!-- ============================================== -->
                <!-- 카드 1: 신규 관리자 생성 -->
                <!-- ============================================== -->
                <section class="admin-card">
                    <div class="card-head">
                        <div class="card-head-text">
                            <strong>신규 관리자 생성</strong>
                            <p>새 Admin 계정을 만듭니다. 생성된 계정은 첫 로그인 시 비밀번호를 변경해야 합니다.</p>
                        </div>
                    </div>

                    <form th:action="@{/owner/admin/create}" th:object="${adminCreateRequest}" method="post">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="loginId">아이디</label>
                                <input type="text" id="loginId" th:field="*{loginId}"
                                       placeholder="아이디 입력 (최대 50자)" required>
                            </div>
                            <div class="form-group">
                                <label for="password">비밀번호</label>
                                <input type="password" id="password" th:field="*{password}"
                                       placeholder="비밀번호 입력 (최소 8자)" required>
                            </div>
                            <div class="form-group">
                                <label for="name">이름</label>
                                <input type="text" id="name" th:field="*{name}"
                                       placeholder="담당자 이름 입력" required>
                            </div>
                            <div class="form-group form-group-btn">
                                <button type="submit" class="btn btn-primary">계정 생성</button>
                            </div>
                        </div>
                    </form>
                </section>

                <!-- ============================================== -->
                <!-- 카드 2: 관리자 목록 -->
                <!-- ============================================== -->
                <section class="admin-card">
                    <h3 class="panel-subtitle">관리자 목록</h3>
                    <p class="panel-desc">계정을 클릭하면 상세 정보를 확인할 수 있습니다.</p>

                    <div class="table-wrap">
                        <table class="admin-table">
                            <thead>
                            <tr>
                                <th class="col-no">No</th>
                                <th>아이디</th>
                                <th>이름</th>
                                <th>상태</th>
                                <th>가입일시</th>
                                <th class="col-action">관리</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="admin : ${admins}">
                                <td class="col-no" th:text="${admin.userId}">1</td>
                                <td>
                                    <a class="admin-login-id"
                                       th:href="@{/owner/admin/{id}(id=${admin.userId})}"
                                       th:text="${admin.loginId}">admin_id</a>
                                </td>
                                <td th:text="${admin.name}">홍길동</td>
                                <td>
                                    <span th:if="${admin.status == 'ACTIVE'}"
                                          class="status-badge status-active">활성</span>
                                    <span th:if="${admin.status == 'WITHDRAWN'}"
                                          class="status-badge status-withdrawn">삭제됨</span>
                                </td>
                                <td class="col-date"
                                    th:text="${#temporals.format(admin.createdAt, 'yyyy-MM-dd HH:mm')}">2026-08-24</td>
                                <td class="col-action">
                                    <div class="action-cell">
                                        <a th:href="@{/owner/admin/{id}(id=${admin.userId})}"
                                           class="btn btn-outline">상세</a>

                                        <!-- 활성 상태 -->
                                        <th:block th:if="${admin.status == 'ACTIVE'}">
                                            <form th:action="@{/owner/admin/{id}/reset-password(id=${admin.userId})}"
                                                  method="post"
                                                  onsubmit="return confirm('비밀번호를 초기화 하시겠습니까?');">
                                                <button type="submit" class="btn btn-warning">초기화</button>
                                            </form>
                                            <form th:action="@{/owner/admin/{id}/delete(id=${admin.userId})}"
                                                  method="post"
                                                  onsubmit="return confirm('이 관리자 계정을 비활성화 하시겠습니까?');">
                                                <button type="submit" class="btn btn-danger">삭제</button>
                                            </form>
                                        </th:block>

                                        <!-- 비활성 상태 -->
                                        <th:block th:if="${admin.status == 'WITHDRAWN'}">
                                            <form th:action="@{/owner/admin/{id}/restore(id=${admin.userId})}"
                                                  method="post"
                                                  onsubmit="return confirm('이 계정을 다시 활성화하시겠습니까?');">
                                                <button type="submit" class="btn btn-success">복구</button>
                                            </form>
                                        </th:block>
                                    </div>
                                </td>
                            </tr>

                            <tr class="empty-row" th:if="${#lists.isEmpty(admins)}">
                                <td colspan="6">등록된 관리자 계정이 없습니다.</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </section>

            </div>
        </div>
        <!-- // 본문 내용 끝 -->
    </div>
</div>

<!-- 하단 푸터 (공통) -->
<div th:replace="~{layout/footer :: footer}"></div>

</body>
</html>
