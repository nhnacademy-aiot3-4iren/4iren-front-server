<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Info 미리보기</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            background-image: url('https://images.unsplash.com/photo-1579546929518-9e396f3cc809?q=80&w=2000&auto=format&fit=crop');
            background-size: cover;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
        }

        .layout {
            display: flex;
            min-height: 100vh;
        }

        .main-wrap {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 10px 20px 25px 0;
            min-width: 0;
        }

        .preview-header {
            padding: 15px 10px;
            font-size: 22px;
            font-weight: 700;
            color: #333;
        }

        .main-content {
            flex: 1;
        }

        /* ================================================================
           사이드바 스타일 (sidebar.css)
           ================================================================ */
        .sidebar {
            width: 250px;
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.3);
            box-shadow:
                    0px 0px 2px rgba(0, 0, 0, 0.1),
                    0px 1px 8px rgba(0, 0, 0, 0.1),
                    inset 3px 3px 0.5px -3.5px #FFFFFF,
                    inset 2px 2px 0.5px -2px #262626,
                    inset -2px -2px 0.5px -2px #262626,
                    inset 0px 0px 0px 1px #A6A6A6,
                    inset 0px 0px 8px #F2F2F2;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border-radius: 21px;
            margin: 10px 20px 25px 10px;
            padding: 30px 0;
            display: flex;
            flex-direction: column;
        }

        .sidebar-logo {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 24px;
        }

        .sidebar-logo img {
            width: 130px;
            height: auto;
            margin-left: -15px;
        }

        .user-info-block {
            padding: 0 24px;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(102, 90, 80, 0.12);
            padding-bottom: 20px;
        }

        .user-role {
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.03em;
        }

        .user-role[data-role="admin"]  { color: #4A90D9; }
        .user-role[data-role="normal"] { color: #999999; }

        .user-name {
            margin: 4px 0 0;
            font-size: 15px;
            font-weight: 500;
            color: #333;
        }

        .sidebar-nav {
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 0 15px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            border-radius: 8px;
            color: #666;
            text-decoration: none;
            font-weight: 400;
            font-size: 14px;
            transition: background-color 0.15s, color 0.15s;
        }

        .nav-item-toggle {
            width: 100%;
            background: none;
            border: none;
            font: inherit;
            text-align: left;
            justify-content: space-between;
            cursor: pointer;
            user-select: none;
        }

        .nav-item-main {
            display: flex;
            align-items: center;
            min-width: 0;
        }

        .nav-icon-chevron {
            flex-shrink: 0;
            margin-left: 8px;
            color: inherit;
            transition: transform 0.15s ease;
        }

        .nav-item-toggle.expanded .nav-icon-chevron {
            transform: rotate(180deg);
        }

        .nav-icon {
            width: 18px;
            height: 18px;
            margin-right: 12px;
            flex-shrink: 0;
            color: inherit;
        }

        .nav-icon-lg {
            width: 22px;
            height: 22px;
        }

        .nav-icon-profile {
            width: 24px;
            height: 24px;
        }

        .nav-item:hover,
        .nav-item-toggle:hover {
            background: rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            color: #444;
        }

        .nav-item.active,
        .nav-item-toggle.expanded {
            background: rgba(255, 255, 255, 0.3);
            box-shadow:
                    0px 0px 2px rgba(0, 0, 0, 0.1),
                    0px 1px 8px rgba(0, 0, 0, 0.1),
                    inset 3px 3px 0.5px -3.5px #FFFFFF,
                    inset 2px 2px 0.5px -2px #262626,
                    inset -2px -2px 0.5px -2px #262626,
                    inset 0px 0px 0px 1px #A6A6A6,
                    inset 0px 0px 8px #F2F2F2;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border-radius: 100px;
            color: #000;
            font-weight: 500;
        }

        .submenu {
            position: relative;
            display: none;
            flex-direction: column;
            gap: 2px;
            padding-left: 34px;
            margin: 0 0 2px 0;
        }

        .submenu.open {
            display: flex;
        }

        .submenu-item {
            position: relative;
            display: flex;
            align-items: center;
            height: 38px;
            padding: 0 12px;
            border-radius: 8px;
            color: #666;
            text-decoration: none;
            font-size: 13.5px;
            transition: background-color 0.15s, color 0.15s;
        }

        .submenu-item::before {
            content: '';
            position: absolute;
            left: -16px;
            top: -21px;
            width: 16px;
            height: 40px;
            border-left: 1.5px solid #b3a89c;
            border-bottom: 1.5px solid #b3a89c;
            border-bottom-left-radius: 8px;
        }

        .submenu-item:first-child::before {
            top: 0;
            height: 19px;
        }

        .submenu-item[data-page="team-list"] {
            margin-bottom: 6px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(102, 90, 80, 0.08);
        }

        .submenu-item:hover {
            background: rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            color: #444;
        }

        .submenu-item.active {
            background: rgba(255, 255, 255, 0.3);
            box-shadow:
                    0px 0px 2px rgba(0, 0, 0, 0.1),
                    0px 1px 8px rgba(0, 0, 0, 0.1),
                    inset 3px 3px 0.5px -3.5px #FFFFFF,
                    inset 2px 2px 0.5px -2px #262626,
                    inset -2px -2px 0.5px -2px #262626,
                    inset 0px 0px 0px 1px #A6A6A6,
                    inset 0px 0px 8px #F2F2F2;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border-radius: 100px;
            color: #000;
            font-weight: 500;
        }

        .sidebar-bottom {
            margin-top: auto;
            padding: 15px;
            border-top: 1px solid #eee;
        }

        .sidebar-bottom .nav-item {
            color: #666;
        }

        .sidebar-bottom .nav-item:hover {
            background: rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            color: #666;
        }

        /* ================================================================
           Team Info 페이지 스타일 (team-info.css)
           ================================================================ */
        .info-cards-row {
            display: flex;
            gap: 24px;
            align-items: flex-start;
            max-width: 1000px;
        }

        .info-card {
            background: #fff;
            border-radius: 20px;
            padding: 32px 36px;
            box-shadow: 0px 1px 8px rgba(0, 0, 0, 0.06);
        }

        .info-left-panel {
            flex: 1.2;
            min-width: 0;
        }

        .info-right-panel {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 20px;
            background: transparent;
            box-shadow: none;
            padding: 0;
        }

        /* 왼쪽 카드 내부 스타일 */
        .info-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .info-header h2 {
            margin: 0;
            font-size: 20px;
            color: #222;
            font-weight: 700;
        }

        .role-admin {
            display: inline-block;
            font-size: 11px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 100px;
            background: #E8F1FC;
            color: #4A90D9;
        }

        .input-section {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 28px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: #888;
            margin-bottom: 8px;
            letter-spacing: 0.03em;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper input[type="text"] {
            width: 100%;
            height: 44px;
            padding: 0 40px 0 14px;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            color: #333;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-wrapper input[type="text"]:focus {
            border-color: #FF9800;
        }

        .clear-btn {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            padding: 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .clear-btn img {
            width: 16px;
            height: 16px;
            opacity: 0.4;
        }

        .clear-btn:hover img {
            opacity: 0.7;
        }

        .form-group textarea {
            width: 100%;
            height: 120px;
            padding: 12px 14px;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            font-family: inherit;
            color: #333;
            resize: none;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group textarea:focus {
            border-color: #FF9800;
        }

        #editTeamName[readonly],
        #editTeamDesc[readonly] {
            background: #f7f7f7;
            color: #888;
            cursor: default;
        }

        .btn-save {
            width: 100%;
            height: 44px;
            background: #FF9800;
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s;
        }

        .btn-save:hover {
            background: #F08700;
        }

        /* 오른쪽 통계 카드 스타일 */
        .stat-card {
            background: #fff;
            border-radius: 20px;
            padding: 24px 28px;
            box-shadow: 0px 1px 8px rgba(0, 0, 0, 0.06);
        }

        .stat-header {
            margin-bottom: 18px;
        }

        .stat-header h3 {
            margin: 0 0 4px;
            font-size: 16px;
            color: #222;
            font-weight: 700;
        }

        .stat-header .sub-text {
            font-size: 12.5px;
            color: #999;
        }

        .stat-boxes {
            display: flex;
            gap: 12px;
        }

        .stat-box {
            flex: 1;
            padding: 16px 18px;
            border-radius: 12px;
            background: #FBFBFC;
            border: 1px solid #F0F0F2;
        }

        .stat-box-link {
            display: block;
            text-decoration: none;
            color: inherit;
            transition: background-color 0.15s, transform 0.1s, border-color 0.15s;
            cursor: pointer;
        }

        .stat-box-link:hover {
            background-color: #FFF8F0;
            border-color: #FFE0B2;
        }

        .stat-box-link:active {
            transform: scale(0.98);
        }

        .stat-label {
            display: block;
            font-size: 13px;
            color: #777;
            margin-bottom: 6px;
            font-weight: 500;
        }

        .stat-value {
            font-size: 18px;
            font-weight: 700;
            color: #333;
        }

        .member-info {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 8px 4px;
        }

        .member-icon-circle {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #FFF3E8;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .member-icon-circle img {
            width: 24px;
            height: 24px;
        }

        .member-count-box {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .member-label {
            font-size: 12px;
            color: #888;
        }

        .member-number {
            font-size: 20px;
            font-weight: 700;
            color: #FF9800;
        }
    </style>
</head>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const editTeamName = document.getElementById('editTeamName');
        const clearNameBtn = document.getElementById('clearNameBtn');
        const saveTeamInfoBtn = document.getElementById('saveTeamInfoBtn');
        const editTeamDesc = document.getElementById('editTeamDesc');

        // 1) 텍스트 지우기 버튼 토글 로직
        if (clearNameBtn && editTeamName) {
            function toggleClearButton() {
                clearNameBtn.style.display = editTeamName.value.length > 0 ? 'flex' : 'none';
            }

            toggleClearButton();
            editTeamName.addEventListener('input', toggleClearButton);

            clearNameBtn.addEventListener('click', () => {
                editTeamName.value = '';
                toggleClearButton();
                editTeamName.focus();
            });
        }

        // 2) 팀 정보 저장 버튼 클릭
        if (saveTeamInfoBtn) {
            saveTeamInfoBtn.addEventListener('click', () => {
                const updatedName = editTeamName.value.trim();
                const updatedDesc = editTeamDesc.value.trim();

                if (!updatedName) {
                    alert("팀 이름을 입력해주세요.");
                    return;
                }

                alert(`[수정 완료 시뮬레이션]\n팀명: ${updatedName}\n설명: ${updatedDesc}`);
            });
        }

        // 3) 사이드바 Team 하위 메뉴 토글
        const teamToggle = document.querySelector('.nav-item-toggle[data-page="team"]');
        const submenu = document.getElementById('team-submenu');

        if (teamToggle && submenu) {
            const toggleSubmenu = function () {
                const isOpen = submenu.classList.toggle('open');
                teamToggle.classList.toggle('expanded', isOpen);
                teamToggle.setAttribute('aria-expanded', String(isOpen));
            };

            teamToggle.addEventListener('click', toggleSubmenu);
            teamToggle.addEventListener('keydown', function (e) {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    toggleSubmenu();
                }
            });
        }
    });
</script>
