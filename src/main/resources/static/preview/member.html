<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Members 미리보기</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
      background-image: url('https://images.unsplash.com/photo-1579546929518-9e396f3cc809?q=80&w=2000&auto=format&fit=crop');
      background-size: cover;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
    }

    .layout {
      display: flex;
      min-height: 100vh;
    }

    .main-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 10px 20px 25px 0;
      min-width: 0;
    }

    .preview-header {
      padding: 15px 10px;
      font-size: 22px;
      font-weight: 700;
      color: #333;
    }

    .main-content {
      flex: 1;
    }

    /* ================================================================
       사이드바 스타일 (sidebar.css)
       ================================================================ */
    .sidebar {
      width: 250px;
      flex-shrink: 0;
      background: rgba(255, 255, 255, 0.3);
      box-shadow:
              0px 0px 2px rgba(0, 0, 0, 0.1),
              0px 1px 8px rgba(0, 0, 0, 0.1),
              inset 3px 3px 0.5px -3.5px #FFFFFF,
              inset 2px 2px 0.5px -2px #262626,
              inset -2px -2px 0.5px -2px #262626,
              inset 0px 0px 0px 1px #A6A6A6,
              inset 0px 0px 8px #F2F2F2;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border-radius: 21px;
      margin: 10px 20px 25px 10px;
      padding: 30px 0;
      display: flex;
      flex-direction: column;
    }

    .sidebar-logo {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 24px;
    }

    .sidebar-logo img {
      width: 130px;
      height: auto;
      margin-left: -15px;
    }

    .user-info-block {
      padding: 0 24px;
      margin-bottom: 20px;
      border-bottom: 1px solid rgba(102, 90, 80, 0.12);
      padding-bottom: 20px;
    }

    .user-role {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.03em;
    }

    .user-role[data-role="admin"]  { color: #4A90D9; }
    .user-role[data-role="normal"] { color: #999999; }

    .user-name {
      margin: 4px 0 0;
      font-size: 15px;
      font-weight: 500;
      color: #333;
    }

    .sidebar-nav {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 0 15px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      padding: 12px 15px;
      border-radius: 8px;
      color: #666;
      text-decoration: none;
      font-weight: 400;
      font-size: 14px;
      transition: background-color 0.15s, color 0.15s;
    }

    .nav-item-toggle {
      width: 100%;
      background: none;
      border: none;
      font: inherit;
      text-align: left;
      justify-content: space-between;
      cursor: pointer;
      user-select: none;
    }

    .nav-item-main {
      display: flex;
      align-items: center;
      min-width: 0;
    }

    .nav-icon-chevron {
      flex-shrink: 0;
      margin-left: 8px;
      color: inherit;
      transition: transform 0.15s ease;
    }

    .nav-item-toggle.expanded .nav-icon-chevron {
      transform: rotate(180deg);
    }

    .nav-icon {
      width: 18px;
      height: 18px;
      margin-right: 12px;
      flex-shrink: 0;
      color: inherit;
    }

    .nav-icon-lg {
      width: 22px;
      height: 22px;
    }

    .nav-icon-profile {
      width: 24px;
      height: 24px;
    }

    .nav-item:hover,
    .nav-item-toggle:hover {
      background: rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      color: #444;
    }

    .nav-item.active,
    .nav-item-toggle.expanded {
      background: rgba(255, 255, 255, 0.3);
      box-shadow:
              0px 0px 2px rgba(0, 0, 0, 0.1),
              0px 1px 8px rgba(0, 0, 0, 0.1),
              inset 3px 3px 0.5px -3.5px #FFFFFF,
              inset 2px 2px 0.5px -2px #262626,
              inset -2px -2px 0.5px -2px #262626,
              inset 0px 0px 0px 1px #A6A6A6,
              inset 0px 0px 8px #F2F2F2;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border-radius: 100px;
      color: #000;
      font-weight: 500;
    }

    .submenu {
      position: relative;
      display: none;
      flex-direction: column;
      gap: 2px;
      padding-left: 34px;
      margin: 0 0 2px 0;
    }

    .submenu.open {
      display: flex;
    }

    .submenu-item {
      position: relative;
      display: flex;
      align-items: center;
      height: 38px;
      padding: 0 12px;
      border-radius: 8px;
      color: #666;
      text-decoration: none;
      font-size: 13.5px;
      transition: background-color 0.15s, color 0.15s;
    }

    .submenu-item::before {
      content: '';
      position: absolute;
      left: -16px;
      top: -21px;
      width: 16px;
      height: 40px;
      border-left: 1.5px solid #b3a89c;
      border-bottom: 1.5px solid #b3a89c;
      border-bottom-left-radius: 8px;
    }

    .submenu-item:first-child::before {
      top: 0;
      height: 19px;
    }

    .submenu-item[data-page="team-list"] {
      margin-bottom: 6px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(102, 90, 80, 0.08);
    }

    .submenu-item:hover {
      background: rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      color: #444;
    }

    .submenu-item.active {
      background: rgba(255, 255, 255, 0.3);
      box-shadow:
              0px 0px 2px rgba(0, 0, 0, 0.1),
              0px 1px 8px rgba(0, 0, 0, 0.1),
              inset 3px 3px 0.5px -3.5px #FFFFFF,
              inset 2px 2px 0.5px -2px #262626,
              inset -2px -2px 0.5px -2px #262626,
              inset 0px 0px 0px 1px #A6A6A6,
              inset 0px 0px 8px #F2F2F2;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border-radius: 100px;
      color: #000;
      font-weight: 500;
    }

    .sidebar-bottom {
      margin-top: auto;
      padding: 15px;
      border-top: 1px solid #eee;
    }

    .sidebar-bottom .nav-item {
      color: #666;
    }

    .sidebar-bottom .nav-item:hover {
      background: rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      color: #666;
    }

    /* ================================================================
       Team Members 및 카드 공통 스타일 (team-info.css + team-members.css)
       ================================================================ */
    .info-card-container {
      width: 100%;
      max-width: 900px;
    }

    .members-page .members-card {
      background: #fff;
      border-radius: 20px;
      padding: 32px 36px;
      width: 100%;
      box-shadow: 0px 1px 8px rgba(0, 0, 0, 0.06);
    }

    .members-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 20px;
    }

    .members-card-header h2 {
      margin: 0 0 4px;
      font-size: 20px;
      color: #222;
    }

    .members-card-header .sub-text {
      margin: 0;
      font-size: 13px;
      color: #999;
    }

    .panel-subtitle {
      font-size: 15px;
      font-weight: 600;
      color: #333;
      margin: 0 0 12px;
    }

    .info-section-divider {
      height: 1px;
      background: #f0f0f0;
      margin: 24px 0;
    }

    /* 설정 행 (초대 코드 발급 행) */
    .setting-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
    }

    .setting-row-text strong {
      display: block;
      font-size: 14px;
      color: #333;
      margin-bottom: 4px;
    }

    .setting-row-text p {
      margin: 0;
      font-size: 12.5px;
      color: #999;
    }

    /* 8칸 초대 코드 */
    .code-squares {
      display: flex;
      gap: 8px;
      margin: 16px 0 12px;
    }

    .code-square {
      width: 40px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #FFF8F0;
      border: 1px solid #FFE0B2;
      border-radius: 8px;
      font-family: monospace;
      font-size: 18px;
      font-weight: 700;
      color: #FF9800;
    }

    /* 팀원 테이블 */
    .members-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13.5px;
    }

    .members-table thead th {
      text-align: left;
      padding: 10px 8px;
      border-bottom: 2px solid #eee;
      color: #999;
      font-weight: 600;
    }

    .members-table tbody td {
      padding: 12px 8px;
      border-bottom: 1px solid #f5f5f5;
      color: #333;
    }

    .members-table .empty-row td {
      text-align: center;
      color: #999;
      padding: 32px 0;
    }

    /* 역할 뱃지 */
    .role-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 100px;
      letter-spacing: 0.02em;
    }

    .role-badge.role-owner { background: #FFF3E8; color: #FF9800; }
    .role-badge.role-admin { background: #E8F1FC; color: #4A90D9; }
    .role-badge.role-normal { background: #F2F2F2; color: #888; }

    /* 버튼 */
    .btn-outline-sm {
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      padding: 5px 12px;
      font-size: 12px;
      color: #555;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-outline-sm:hover {
      background: #f7f7f7;
    }

    .btn-primary {
      background: #FF9800;
      border: none;
      border-radius: 8px;
      padding: 9px 18px;
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
    }

    .btn-primary:hover {
      background: #F08700;
    }

    .btn-primary:disabled {
      background: #ffcf94;
      cursor: not-allowed;
    }

    /* 페이지네이션 */
    .building-pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      margin-top: 24px;
      font-size: 13px;
    }

    .building-pagination a {
      color: #555;
      text-decoration: none;
      padding: 4px 8px;
      border-radius: 4px;
    }

    .building-pagination a:hover:not(.disabled) {
      background: #f0f0f0;
    }

    .building-pagination a.disabled {
      color: #ccc;
      pointer-events: none;
    }
  </style>
</head>

  <!-- 메인 컨텐츠 영역 -->
  <div class="main-wrap">

    <div class="preview-header">Team Members</div>

    <main class="main-content">
      <div class="info-card-container members-page">

        <section class="members-card">
          <div class="members-card-header">
            <div>
              <h2>Members</h2>
              <p class="sub-text">팀 포이렌 (4iren)</p>
            </div>
          </div>

          <!-- 초대 코드 발급 영역 -->
          <div class="setting-row">
            <div class="setting-row-text">
              <strong>초대 코드</strong>
              <p>새로운 8자리 초대 코드를 발급합니다. (활성 팀에서만 가능)</p>
            </div>
            <button type="button" class="btn-primary" id="createInviteCodeBtn">코드 생성</button>
          </div>

          <!-- 8칸 사각 박스 UI -->
          <div class="code-squares" id="codeSquaresContainer" hidden>
            <div class="code-square"></div>
            <div class="code-square"></div>
            <div class="code-square"></div>
            <div class="code-square"></div>
            <div class="code-square"></div>
            <div class="code-square"></div>
            <div class="code-square"></div>
            <div class="code-square"></div>
          </div>
          <button type="button" class="btn-outline-sm" id="copyInviteCodeBtn" hidden>복사</button>

          <div class="info-section-divider"></div>

          <!-- 팀원 목록 테이블 -->
          <h3 class="panel-subtitle">팀원 목록</h3>
          <table class="members-table">
            <thead>
            <tr>
              <th>User ID</th>
              <th>역할</th>
              <th>관리</th>
            </tr>
            </thead>
            <tbody id="membersTableBody">
            <tr class="empty-row">
              <td colspan="3">팀원 목록을 불러오는 중입니다.</td>
            </tr>
            </tbody>
          </table>

          <!-- 페이지네이션 -->
          <nav class="building-pagination" id="membersPagination" hidden>
            <a href="#" id="membersPrevBtn">Previous</a>
            <span id="membersPageIndicator">1 / 1</span>
            <a href="#" id="membersNextBtn">Next</a>
          </nav>
        </section>

      </div>
    </main>
  </div>
</div>

<script>
  // ==========================================
  // 1) 가상 더미 데이터 및 팀원 목록 렌더링 로직
  // ==========================================
  const dummyMembers = [
    { teamMemberId: 101, userId: 12, teamRole: 'OWNER' },
    { teamMemberId: 102, userId: 45, teamRole: 'ADMIN' },
    { teamMemberId: 103, userId: 78, teamRole: 'NORMAL' },
    { teamMemberId: 104, userId: 91, teamRole: 'NORMAL' },
    { teamMemberId: 105, userId: 104, teamRole: 'NORMAL' }
  ];

  let currentPage = 0;
  const pageSize = 5;

  function loadMembers(page = 0) {
    const tbody = document.getElementById('membersTableBody');
    tbody.innerHTML = '<tr class="empty-row"><td colspan="3">팀원 목록을 불러오는 중입니다.</td></tr>';

    setTimeout(() => {
      const totalPages = Math.ceil(dummyMembers.length / pageSize) || 1;
      const start = page * pageSize;
      const content = dummyMembers.slice(start, start + pageSize);

      renderMembers(content);
      renderPagination({
        page: page,
        totalPages: totalPages,
        first: page === 0,
        last: page >= totalPages - 1
      });
    }, 200);
  }

  function renderMembers(members) {
    const tbody = document.getElementById('membersTableBody');

    if (members.length === 0) {
      tbody.innerHTML = '<tr class="empty-row"><td colspan="3">팀원이 없습니다.</td></tr>';
      return;
    }

    tbody.innerHTML = members.map(member => `
            <tr>
                <td>User #${member.userId}</td>
                <td><span class="role-badge role-${member.teamRole.toLowerCase()}">${member.teamRole}</span></td>
                <td>
                    ${member.teamRole !== 'OWNER'
            ? `<button type="button" class="btn-outline-sm remove-member-btn" data-member-id="${member.teamMemberId}">내보내기</button>`
            : '-'}
                </td>
            </tr>
        `).join('');

    tbody.querySelectorAll('.remove-member-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        alert('팀원 내보내기 기능은 아직 준비 중입니다.');
      });
    });
  }

  function renderPagination(pageResult) {
    const pagination = document.getElementById('membersPagination');
    const indicator = document.getElementById('membersPageIndicator');
    const prevBtn = document.getElementById('membersPrevBtn');
    const nextBtn = document.getElementById('membersNextBtn');

    if (pageResult.totalPages <= 1) {
      pagination.hidden = true;
      return;
    }

    pagination.hidden = false;
    indicator.textContent = `${pageResult.page + 1} / ${pageResult.totalPages}`;

    prevBtn.classList.toggle('disabled', pageResult.first);
    nextBtn.classList.toggle('disabled', pageResult.last);

    prevBtn.onclick = (e) => {
      e.preventDefault();
      if (!pageResult.first) loadMembers(pageResult.page - 1);
    };
    nextBtn.onclick = (e) => {
      e.preventDefault();
      if (!pageResult.last) loadMembers(pageResult.page + 1);
    };
  }

  // ==========================================
  // 2) 초대 코드 생성 & 복사 로직
  // ==========================================
  const createInviteCodeBtn = document.getElementById('createInviteCodeBtn');
  const codeSquares = document.querySelectorAll('#codeSquaresContainer .code-square');
  const codeSquaresContainer = document.getElementById('codeSquaresContainer');
  const copyInviteCodeBtn = document.getElementById('copyInviteCodeBtn');
  let currentInviteCode = '';

  if (createInviteCodeBtn) {
    createInviteCodeBtn.addEventListener('click', () => {
      createInviteCodeBtn.disabled = true;
      createInviteCodeBtn.textContent = '생성 중...';
      currentInviteCode = '';
      codeSquares.forEach(sq => sq.textContent = '');

      setTimeout(() => {
        currentInviteCode = Math.random().toString(36).substring(2, 10).toUpperCase();

        for (let i = 0; i < codeSquares.length; i += 1) {
          codeSquares[i].textContent = currentInviteCode[i] || '';
        }

        codeSquaresContainer.hidden = false;
        copyInviteCodeBtn.hidden = false;

        createInviteCodeBtn.disabled = false;
        createInviteCodeBtn.textContent = '코드 생성';
      }, 300);
    });
  }

  if (copyInviteCodeBtn) {
    copyInviteCodeBtn.addEventListener('click', () => {
      if (!currentInviteCode) {
        alert('아직 코드가 발급되지 않았습니다.');
        return;
      }
      navigator.clipboard.writeText(currentInviteCode)
              .then(() => alert('초대 코드가 복사되었습니다!'))
              .catch(() => alert('복사에 실패했습니다.'));
    });
  }

  // ==========================================
  // 3) 사이드바 Team 하위 메뉴 토글
  // ==========================================
  const teamToggle = document.querySelector('.nav-item-toggle[data-page="team"]');
  const submenu = document.getElementById('team-submenu');

  if (teamToggle && submenu) {
    const toggleSubmenu = function () {
      const isOpen = submenu.classList.toggle('open');
      teamToggle.classList.toggle('expanded', isOpen);
      teamToggle.setAttribute('aria-expanded', String(isOpen));
    };

    teamToggle.addEventListener('click', toggleSubmenu);
    teamToggle.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        toggleSubmenu();
      }
    });
  }

  document.addEventListener('DOMContentLoaded', () => loadMembers(0));
</script>

</body>
</html>
