

spring:
  application:
    name: 4iren-front
  # html,css 수정시 새로고침 안해도 바로 반영되는 코드
  thymeleaf:
    cache: false
  web:
    resources:
      cache:
        cachecontrol:
          max-age: 10m
          cache-public: true
          no-store: false

  cloud:
    openfeign:
      okhttp:
        enabled: true
      client:
        config:
          default:
            connect-timeout: 3000
            read-timeout: 60000

logging:
  level:
    root: info

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

app:
  cookie:
    secure: true

dashboard:
  refresh-interval: 30s
  thresholds:
    temperature:
      warning-min: 18
      warning-max: 28
      danger-min: 14
      danger-max: 32
    humidity:
      warning-min: 30
      warning-max: 70
      danger-min: 20
      danger-max: 80
    co2:
      warning-max: 1000
      danger-max: 1500

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
